<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Antrenman Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen pb-28 font-sans select-none">

  <!-- Üst Başlık & Özet -->
  <header class="p-4 pt-6 border-b border-zinc-900 sticky top-0 bg-black/95 backdrop-blur-md z-40 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-white">Upper Body</h1>
      <p class="text-[11px] text-zinc-400">Omuz, Göğüs, Sırt, Kol Rutini</p>
    </div>
    <div class="flex items-center gap-2">
      <span id="completedCounter" class="text-xs bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full font-semibold">0 Set Tamam</span>
    </div>
  </header>

  <!-- Egzersiz Listesi -->
  <main id="routineContainer" class="p-3 space-y-4 max-w-lg mx-auto"></main>

  <!-- Detay Modalı (Grafik, YouTube & Geçmiş) -->
  <div id="detailModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-zinc-900 border border-zinc-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h2 id="modalExTitle" class="text-lg font-bold text-white leading-tight"></h2>
          <span id="modalExMuscle" class="text-xs text-blue-400 font-medium"></span>
        </div>
        <button onclick="closeDetailModal()" class="text-zinc-400 hover:text-white text-xl font-bold p-1">✕</button>
      </div>

      <!-- YouTube Zaman Ayarlı Video Butonu -->
      <div id="videoContainer" class="mb-4">
        <a id="videoLink" href="#" target="_blank" class="flex items-center justify-between bg-zinc-800/80 border border-zinc-700 hover:border-blue-500 p-3 rounded-xl text-xs text-zinc-200 transition">
          <span class="flex items-center gap-2.5 font-medium">
            <span class="text-rose-500 text-base">▶</span> Form & Yapılış Rehberini İzle
          </span>
          <span class="text-[11px] text-zinc-400 font-mono bg-zinc-900 px-2 py-0.5 rounded border border-zinc-700" id="videoTimeBadge">00:00</span>
        </a>
      </div>

      <!-- İlerleme Grafiği -->
      <div class="bg-black border border-zinc-800 rounded-xl p-3 mb-4">
        <h4 class="text-[11px] font-semibold text-zinc-400 mb-2 tracking-wide">AĞIRLIK GELİŞİM GRAFİĞİ (KG)</h4>
        <canvas id="exerciseChart" height="170"></canvas>
      </div>

      <!-- Geçmiş Kayıtlar -->
      <div>
        <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Tüm Antrenman Geçmişi</h3>
        <div id="historyList" class="space-y-1.5 max-h-48 overflow-y-auto text-xs"></div>
      </div>
    </div>
  </div>

  <script>
    // Ortak Egzersiz Havuzu (YouTube saniye ayarlı parametreler eklendi: &t=X)
    const exercisePool = [
      { id: "sp", name: "Shoulder Press", muscle: "Omuz (Ön/Yan)", videoUrl: "https://www.youtube.com/watch?v=qEwKCR5JCog&t=45s", time: "00:45" },
      { id: "clr", name: "Cable Lateral Raise", muscle: "Yan Omuz", videoUrl: "https://www.youtube.com/watch?v=PPrzBWZDOhA&t=30s", time: "00:30" },
      { id: "bp", name: "Bench Press", muscle: "Göğüs, Ön Omuz, Triceps", videoUrl: "https://www.youtube.com/watch?v=rT7DgCr-3pg&t=60s", time: "01:00" },
      { id: "cf", name: "Cable Fly", muscle: "İç / Orta Göğüs", videoUrl: "https://www.youtube.com/watch?v=Iwe6AmxVf7o&t=20s", time: "00:20" },
      { id: "scr", name: "Seated Cable Row", muscle: "Sırt, Lat, Rhomboid", videoUrl: "https://www.youtube.com/watch?v=GZbfZ033f74&t=15s", time: "00:15" },
      { id: "lp", name: "Lat Pulldown", muscle: "Üst Sırt, Kanat", videoUrl: "https://www.youtube.com/watch?v=CAwf7n6Luuc&t=40s", time: "00:40" },
      { id: "tb", name: "Triceps Bar Baş Üstü", muscle: "Arka Kol (Uzun Baş)", videoUrl: "https://www.youtube.com/watch?v=b_Xhx2qS3oU&t=25s", time: "00:25" },
      { id: "btk", name: "Biceps Tek Kol", muscle: "Ön Kol (Biceps)", videoUrl: "https://www.youtube.com/watch?v=ykJmrZ5v0Oo&t=10s", time: "00:10" }
    ];

    let chartInstance = null;

    // Veri Saklama Yardımcıları
    function getHistory(exId) {
      return JSON.parse(localStorage.getItem(`fit_history_${exId}`) || "[]");
    }

    function saveHistory(exId, history) {
      localStorage.setItem(`fit_history_${exId}`, JSON.stringify(history));
    }

    // Aktif oturumdaki setleri geçici hafızada tut
    let activeSets = JSON.parse(localStorage.getItem("fit_active_sets") || "{}");

    function saveActiveSets() {
      localStorage.setItem("fit_active_sets", JSON.stringify(activeSets));
      updateCounter();
    }

    function initActiveSets() {
      exercisePool.forEach(ex => {
        if (!activeSets[ex.id]) {
          const hist = getHistory(ex.id);
          const last = hist[hist.length - 1];
          // Varsayılan olarak 2 set başlatır, varsa son yapılan ağırlıkları getirir
          activeSets[ex.id] = [
            { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "Norm", done: false },
            { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "F", done: false }
          ];
        }
      });
      saveActiveSets();
    }

    // Ekranı Çizdir
    function renderApp() {
      const container = document.getElementById("routineContainer");
      container.innerHTML = "";

      exercisePool.forEach(ex => {
        const sets = activeSets[ex.id] || [];
        const hist = getHistory(ex.id);
        const lastRec = hist[hist.length - 1];

        const card = document.createElement("div");
        card.className = "bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4";

        let setsHtml = "";
        sets.forEach((set, idx) => {
          const isDone = set.done;
          setsHtml += `
            <div class="flex items-center gap-1.5 bg-black/60 p-2 rounded-xl border ${isDone ? 'border-blue-500/40 bg-blue-950/10' : 'border-zinc-800/80'}">
              <span class="w-6 text-xs font-bold ${isDone ? 'text-blue-400' : 'text-zinc-500'} font-mono">${idx + 1}</span>
              <input type="text" placeholder="${lastRec ? lastRec.kg : 'KG'}" value="${set.kg}" onchange="updateSetVal('${ex.id}', ${idx}, 'kg', this.value)" class="flex-1 bg-zinc-800/80 border border-zinc-700 rounded-lg p-1.5 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              <input type="text" placeholder="${lastRec ? lastRec.reps : 'Tekrar'}" value="${set.reps}" onchange="updateSetVal('${ex.id}', ${idx}, 'reps', this.value)" class="flex-1 bg-zinc-800/80 border border-zinc-700 rounded-lg p-1.5 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              
              <select onchange="updateSetVal('${ex.id}', ${idx}, 'type', this.value)" class="w-14 bg-zinc-800/80 border border-zinc-700 rounded-lg p-1.5 text-center text-[10px] font-bold ${set.type === 'F' ? 'text-rose-400' : set.type.includes('R') ? 'text-amber-400' : 'text-zinc-300'} focus:outline-none">
                <option value="Norm" ${set.type === 'Norm' ? 'selected' : ''}>Norm</option>
                <option value="F" ${set.type === 'F' ? 'selected' : ''}>F</option>
                <option value="R1" ${set.type === 'R1' ? 'selected' : ''}>R1</option>
                <option value="R2" ${set.type === 'R2' ? 'selected' : ''}>R2</option>
                <option value="W" ${set.type === 'W' ? 'selected' : ''}>W</option>
              </select>

              <button onclick="toggleSet('${ex.id}', ${idx})" class="w-8 h-8 rounded-lg font-bold flex items-center justify-center text-xs transition active:scale-90 ${isDone ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'bg-zinc-800 text-zinc-500'}">✓</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3 cursor-pointer" onclick="openDetailModal('${ex.id}')">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-blue-600/20 text-blue-400 font-bold flex items-center justify-center text-xs">
                ${ex.name.charAt(0)}
              </div>
              <div>
                <h3 class="text-blue-400 font-bold text-sm hover:underline">${ex.name}</h3>
                <p class="text-[11px] text-zinc-400">${ex.muscle}</p>
              </div>
            </div>
            <span class="text-xs text-zinc-500 font-mono">Detay ›</span>
          </div>

          <div class="space-y-2 mb-3">
            <div class="flex justify-between text-zinc-500 font-mono text-[10px] px-1">
              <span class="w-6">SET</span>
              <span class="flex-1 text-center">KG / DUMBBELL</span>
              <span class="flex-1 text-center">TEKRAR</span>
              <span class="w-14 text-center">TÜR</span>
              <span class="w-8 text-right">TİK</span>
            </div>
            ${setsHtml}
          </div>

          <div class="flex justify-between items-center pt-1 border-t border-zinc-800/60">
            <button onclick="addSet('${ex.id}')" class="text-xs font-semibold text-blue-400 hover:text-blue-300 py-1 px-2 rounded-lg bg-blue-600/10">+ Set Ekle</button>
            <button onclick="removeSet('${ex.id}')" class="text-[11px] text-zinc-500 hover:text-rose-400 py-1 px-2">Set Sil</button>
          </div>
        `;
        container.appendChild(card);
      });
      updateCounter();
    }

    function updateSetVal(exId, idx, field, val) {
      if (activeSets[exId] && activeSets[exId][idx]) {
        activeSets[exId][idx][field] = val;
        saveActiveSets();
      }
    }

    function addSet(exId) {
      const sets = activeSets[exId] || [];
      const prev = sets[sets.length - 1];
      sets.push({ kg: prev ? prev.kg : "", reps: prev ? prev.reps : "", type: "Norm", done: false });
      activeSets[exId] = sets;
      saveActiveSets();
      renderApp();
    }

    function removeSet(exId) {
      if (activeSets[exId] && activeSets[exId].length > 1) {
        activeSets[exId].pop();
        saveActiveSets();
        renderApp();
      }
    }

    function toggleSet(exId, idx) {
      const set = activeSets[exId][idx];
      if (!set.kg) {
        alert("Lütfen bir ağırlık gir!");
        return;
      }

      set.done = !set.done;
      saveActiveSets();

      // Tik atıldıysa ortak egzersiz havuzunun geçmişine yaz
      if (set.done) {
        const hist = getHistory(exId);
        const date = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        hist.push({ date, kg: set.kg, reps: set.reps || "8", type: set.type });
        saveHistory(exId, hist);
      }
      renderApp();
    }

    function updateCounter() {
      let totalDone = 0;
      Object.values(activeSets).forEach(arr => {
        arr.forEach(s => { if (s.done) totalDone++; });
      });
      document.getElementById("completedCounter").innerText = `${totalDone} Set Tamam`;
    }

    // Modal Fonksiyonları
    function openDetailModal(exId) {
      const ex = exercisePool.find(e => e.id === exId);
      if (!ex) return;

      document.getElementById("modalExTitle").innerText = ex.name;
      document.getElementById("modalExMuscle").innerText = ex.muscle;

      const linkEl = document.getElementById("videoLink");
      const timeBadge = document.getElementById("videoTimeBadge");
      linkEl.href = ex.videoUrl;
      timeBadge.innerText = ex.time || "İzle";

      const hist = getHistory(exId);
      const histContainer = document.getElementById("historyList");
      histContainer.innerHTML = "";

      if (hist.length === 0) {
        histContainer.innerHTML = `<p class="text-zinc-500 text-xs py-2 text-center">Henüz tamamlanan set geçmişi yok.</p>`;
      } else {
        [...hist].reverse().forEach(h => {
          const row = document.createElement("div");
          row.className = "flex justify-between items-center bg-black/60 p-2 rounded-lg border border-zinc-800 text-xs font-mono";
          row.innerHTML = `
            <span class="text-zinc-400">${h.date}</span>
            <span class="font-bold text-white">${h.kg} KG</span>
            <span class="text-zinc-400">${h.reps} Tekrar</span>
            <span class="${h.type === 'F' ? 'text-rose-400' : 'text-amber-400'} font-bold">[${h.type}]</span>
          `;
          histContainer.appendChild(row);
        });
      }

      // Grafik Çizimi
      const ctx = document.getElementById('exerciseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = hist.map(h => h.date);
      const dataPoints = hist.map(h => {
        const nums = h.kg.match(/\d+(\.\d+)?/g);
        if (!nums) return 0;
        return nums.reduce((a, b) => parseFloat(a) + parseFloat(b), 0);
      });

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.slice(-10),
          datasets: [{
            data: dataPoints.slice(-10),
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.12)',
            borderWidth: 2,
            tension: 0.35,
            fill: true,
            pointBackgroundColor: '#2563eb'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717a', font: { size: 10 } } },
            y: { grid: { color: '#18181b' }, ticks: { color: '#71717a', font: { size: 10 } } }
          }
        }
      });

      document.getElementById("detailModal").classList.remove("hidden");
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.add("hidden");
    }

    initActiveSets();
    renderApp();
  </script>
</body>
</html>
