<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Antrenman Takip</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --sat: env(safe-area-inset-top, 44px);
    }
    body {
      padding-top: var(--sat);
      background-color: #000000;
      color: #f4f4f5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      letter-spacing: -0.015em;
    }
    
    .font-num {
      font-family: 'JetBrains Mono', -apple-system, monospace;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    body.modal-open {
      overflow: hidden !important;
      touch-action: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* --- AKICI SAYFA & ELEMENT GEÇİŞLERİ --- */
    @keyframes pageSlideIn {
      0% {
        opacity: 0;
        transform: translateX(20px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes pageSlideBack {
      0% {
        opacity: 0;
        transform: translateX(-20px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes modalCenterPop {
      0% {
        opacity: 0;
        transform: scale(0.90) translateY(14px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes sheetSlideUp {
      0% { transform: translateY(100%); }
      100% { transform: translateY(0); }
    }
    @keyframes cardFadeInUp {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .anim-page-forward { animation: pageSlideIn 0.32s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
    .anim-page-back { animation: pageSlideBack 0.32s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
    .anim-pop-center { animation: modalCenterPop 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-sheet-up { animation: sheetSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-fade { animation: fadeIn 0.22s ease-out forwards; }
    .animate-card { animation: cardFadeInUp 0.34s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Dokunma Geri Bildirimi (Micro-Feedback) */
    .tap-press {
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }
    .tap-press:active {
      transform: scale(0.94);
      opacity: 0.85;
    }
  </style>
</head>
<body class="min-h-screen pb-24 antialiased">

  <!-- ================= EKRAN 1: ANA SAYFA ================= -->
  <div id="viewHome" class="px-4 max-w-md mx-auto">
    <header class="py-5 border-b border-zinc-900/80 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-white">Programlar</h1>
        <p class="text-xs text-zinc-500 font-medium mt-0.5">Antrenmana başlamak için seç</p>
      </div>
      <button onclick="openNewRoutineModal()" class="tap-press bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2.5 rounded-2xl shadow-lg shadow-blue-600/30 flex items-center gap-1.5">
        <span class="text-sm font-extrabold">+</span> Yeni Program
      </button>
    </header>

    <div id="routineCardList" class="mt-4 space-y-3"></div>
  </div>


  <!-- ================= EKRAN 2: AKTİF ANTRENMAN EKRANI ================= -->
  <div id="viewWorkout" class="hidden px-3 max-w-md mx-auto">
    <header class="py-3 border-b border-zinc-900/80 flex justify-between items-center sticky top-0 bg-black/95 backdrop-blur-md z-30">
      <div class="flex items-center gap-2.5">
        <button onclick="goHome()" class="tap-press w-9 h-9 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-sm font-bold text-zinc-300">
          ←
        </button>
        <div>
          <h2 id="workoutTitle" class="text-base font-extrabold text-white leading-tight"></h2>
          <span id="workoutSubtitle" class="text-[11px] text-zinc-500 font-num">0 Egzersiz</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="completedCounter" class="text-[11px] bg-blue-600/15 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full font-num font-bold">0 Set</span>
        <button onclick="deleteCurrentRoutine()" class="tap-press w-9 h-9 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-500 hover:text-rose-400 flex items-center justify-center text-xs">
          🗑️
        </button>
      </div>
    </header>

    <main id="routineContainer" class="mt-3.5 space-y-3"></main>

    <div class="mt-4">
      <button onclick="openExerciseSelector()" class="tap-press w-full py-4 rounded-2xl bg-zinc-950 border border-zinc-850 hover:border-zinc-700 text-blue-400 font-extrabold text-xs flex items-center justify-center gap-2 shadow-lg">
        <span class="text-base font-bold">+</span> Egzersiz Ekle
      </button>
    </div>
  </div>


  <!-- ================= MERKEZİ POPUP: YENİ PROGRAM ADI ================= -->
  <div id="newRoutineModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 anim-fade" onclick="closeNewRoutineModal(event)">
    <div class="bg-zinc-900/95 border border-zinc-800 w-full max-w-sm rounded-[28px] p-6 shadow-2xl anim-pop-center" onclick="event.stopPropagation()">
      <div class="w-12 h-12 rounded-2xl bg-blue-600/15 text-blue-400 flex items-center justify-center font-bold text-xl mx-auto mb-3 border border-blue-500/20">
        📋
      </div>
      <h3 class="text-center text-lg font-black text-white mb-1 tracking-tight">Yeni Program</h3>
      <p class="text-center text-xs text-zinc-400 mb-5 font-medium">Programına vermek istediğin ismi yaz.</p>

      <input id="newRoutineInput" type="text" placeholder="Örn: Upper Body, Push, İtiş" class="w-full bg-black/80 border border-zinc-700 focus:border-blue-500 rounded-2xl p-3.5 text-center text-sm text-white focus:outline-none mb-5 transition font-semibold">

      <div class="flex gap-2.5">
        <button onclick="closeNewRoutineModal()" class="tap-press flex-1 py-3.5 rounded-2xl bg-zinc-800 text-zinc-300 font-bold text-xs">Vazgeç</button>
        <button onclick="submitNewRoutine()" class="tap-press flex-1 py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg shadow-blue-600/30">Oluştur</button>
      </div>
    </div>
  </div>


  <!-- ================= MERKEZİ POPUP: YENİ HAREKET TANIMLA ================= -->
  <div id="newExerciseModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 anim-fade" onclick="closeNewExerciseModal(event)">
    <div class="bg-zinc-900/95 border border-zinc-800 w-full max-w-sm rounded-[28px] p-6 shadow-2xl anim-pop-center" onclick="event.stopPropagation()">
      <div class="w-12 h-12 rounded-2xl bg-blue-600/15 text-blue-400 flex items-center justify-center font-bold text-xl mx-auto mb-3 border border-blue-500/20">
        💪
      </div>
      <h3 class="text-center text-lg font-black text-white mb-1 tracking-tight">Yeni Egzersiz</h3>
      <p class="text-center text-xs text-zinc-400 mb-4 font-medium">Hareket adını ve kas bölgesini belirle.</p>

      <input id="newExNameInput" type="text" placeholder="Hareket Adı (Örn: Incline DB Press)" class="w-full bg-black/80 border border-zinc-700 focus:border-blue-500 rounded-2xl p-3.5 text-center text-xs text-white focus:outline-none mb-2.5 transition font-semibold">

      <input id="newExMuscleInput" type="text" placeholder="Bölge (Göğüs, Omuz, Sırt, Kol)" class="w-full bg-black/80 border border-zinc-700 focus:border-blue-500 rounded-2xl p-3.5 text-center text-xs text-white focus:outline-none mb-5 transition font-semibold">

      <div class="flex gap-2.5">
        <button onclick="closeNewExerciseModal()" class="tap-press flex-1 py-3.5 rounded-2xl bg-zinc-800 text-zinc-300 font-bold text-xs">İptal</button>
        <button onclick="submitNewExercise()" class="tap-press flex-1 py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg shadow-blue-600/30">Havuza Ekle</button>
      </div>
    </div>
  </div>


  <!-- ================= ALTTAN AÇILAN PANEL: ÇOKLU EGZERSİZ SEÇİMİ ================= -->
  <div id="exercisePickerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end justify-center anim-fade" onclick="closeExerciseSelector(event)">
    <div class="bg-zinc-900 border-t border-zinc-800 w-full max-w-md rounded-t-[32px] p-5 max-h-[85vh] flex flex-col shadow-2xl anim-sheet-up" onclick="event.stopPropagation()">
      <div class="w-12 h-1.5 bg-zinc-700 rounded-full mx-auto mb-3.5"></div>
      
      <div class="flex justify-between items-center mb-2 px-1">
        <div>
          <h2 class="text-base font-extrabold text-white tracking-tight">Egzersiz Havuzu</h2>
          <p class="text-[11px] text-zinc-400 font-medium">Programa eklemek istediklerini seç</p>
        </div>
        <button onclick="closeExerciseSelector()" class="tap-press text-zinc-400 text-lg font-bold p-1">✕</button>
      </div>

      <button onclick="openNewExerciseModal()" class="tap-press my-3 w-full py-3 rounded-2xl bg-black/70 border border-zinc-800 text-blue-400 text-xs font-bold shadow-sm">
        + Listede Olmayan Yeni Hareket Üret
      </button>

      <div id="pickerList" class="space-y-2 overflow-y-auto flex-1 py-1 pr-1 overscroll-contain"></div>

      <div class="pt-3.5 border-t border-zinc-800 mt-2">
        <button onclick="saveSelectedExercises()" id="btnConfirmSelect" class="tap-press w-full py-4 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs shadow-lg shadow-blue-600/30">
          Seçilenleri Kaydet
        </button>
      </div>
    </div>
  </div>


  <!-- ================= DETAY MODALI (GRAFİK & GEÇMİŞ) ================= -->
  <div id="detailModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-end justify-center anim-fade" onclick="closeDetailModal(event)">
    <div class="bg-zinc-900 border-t border-zinc-800 w-full max-w-md rounded-t-[32px] p-5 max-h-[85vh] overflow-y-auto overscroll-contain anim-sheet-up" onclick="event.stopPropagation()">
      <div class="w-12 h-1.5 bg-zinc-700 rounded-full mx-auto mb-3.5"></div>
      
      <div class="flex justify-between items-center mb-3 px-1">
        <div>
          <h2 id="modalExTitle" class="text-base font-extrabold text-white leading-tight"></h2>
          <span id="modalExMuscle" class="text-[11px] text-blue-400 font-semibold"></span>
        </div>
        <button onclick="closeDetailModal()" class="tap-press text-zinc-400 text-lg font-bold p-1">✕</button>
      </div>

      <div class="bg-black/80 border border-zinc-800/80 rounded-2xl p-3.5 mb-3.5">
        <h4 class="text-[10px] font-bold text-zinc-400 mb-1.5 tracking-wider font-num">AĞIRLIK GELİŞİM GRAFİĞİ (KG)</h4>
        <canvas id="exerciseChart" height="150"></canvas>
      </div>

      <div>
        <h3 class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-2 font-num">Geçmiş Kayıtlar</h3>
        <div id="historyList" class="space-y-1.5 max-h-40 overflow-y-auto text-xs pr-1"></div>
      </div>
    </div>
  </div>


  <script>
    let globalExercisePool = JSON.parse(localStorage.getItem("fit_pool")) || [
      { id: "sp", name: "Shoulder Press", muscle: "Omuz" },
      { id: "clr", name: "Cable Lateral Raise", muscle: "Omuz" },
      { id: "bp", name: "Bench Press", muscle: "Göğüs" },
      { id: "cf", name: "Cable Fly", muscle: "Göğüs" },
      { id: "scr", name: "Seated Cable Row", muscle: "Sırt" },
      { id: "lp", name: "Lat Pulldown", muscle: "Sırt" },
      { id: "tb", name: "Triceps Bar Baş Üstü", muscle: "Triceps" },
      { id: "btk", name: "Biceps Tek Kol", muscle: "Biceps" }
    ];

    let routines = JSON.parse(localStorage.getItem("fit_routines")) || [];
    let currentRoutineId = null;
    let tempSelectedExerciseIds = [];
    let chartInstance = null;

    function savePool() { localStorage.setItem("fit_pool", JSON.stringify(globalExercisePool)); }
    function saveRoutines() { localStorage.setItem("fit_routines", JSON.stringify(routines)); }
    function getHistory(exId) { return JSON.parse(localStorage.getItem(`fit_history_${exId}`) || "[]"); }
    function saveHistory(exId, history) { localStorage.setItem(`fit_history_${exId}`, JSON.stringify(history)); }

    let activeSets = JSON.parse(localStorage.getItem("fit_active_sets") || "{}");
    function saveActiveSets() {
      localStorage.setItem("fit_active_sets", JSON.stringify(activeSets));
      updateCompletedCounter();
    }

    function lockScroll() { document.body.classList.add("modal-open"); }
    function unlockScroll() { document.body.classList.remove("modal-open"); }

    // --- AKICI SAYFA GEÇİŞLERİ ---
    function goHome() {
      currentRoutineId = null;
      const vWorkout = document.getElementById("viewWorkout");
      const vHome = document.getElementById("viewHome");
      
      vWorkout.classList.add("hidden");
      vWorkout.classList.remove("anim-page-forward");

      vHome.classList.remove("hidden");
      vHome.classList.remove("anim-page-forward");
      vHome.classList.add("anim-page-back");
      renderHome();
    }

    function openWorkout(routineId) {
      currentRoutineId = routineId;
      const vHome = document.getElementById("viewHome");
      const vWorkout = document.getElementById("viewWorkout");

      vHome.classList.add("hidden");
      vHome.classList.remove("anim-page-back");

      vWorkout.classList.remove("hidden");
      vWorkout.classList.remove("anim-page-back");
      vWorkout.classList.add("anim-page-forward");
      renderWorkout(true);
    }

    function renderHome() {
      const container = document.getElementById("routineCardList");
      container.innerHTML = "";

      if (routines.length === 0) {
        container.innerHTML = `
          <div class="bg-zinc-950 border border-zinc-900 rounded-[28px] p-8 text-center mt-6">
            <div class="w-14 h-14 rounded-2xl bg-blue-600/10 text-blue-500 font-bold text-2xl flex items-center justify-center mx-auto mb-3">📋</div>
            <h3 class="text-base font-extrabold text-white mb-1">Henüz Program Yok</h3>
            <p class="text-xs text-zinc-500 mb-5 font-medium leading-relaxed">Yeni bir antrenman programı oluşturarak egzersizlerini eklemeye başlayabilirsin.</p>
          </div>
        `;
        return;
      }

      routines.forEach((r, idx) => {
        const count = r.exerciseIds.length;
        const card = document.createElement("div");
        card.className = "tap-press bg-zinc-950 border border-zinc-850 p-4 rounded-2xl flex items-center justify-between cursor-pointer animate-card shadow-md";
        card.style.animationDelay = `${idx * 45}ms`;
        card.onclick = () => openWorkout(r.id);
        card.innerHTML = `
          <div>
            <h3 class="text-base font-bold text-white mb-0.5 tracking-tight">${r.name}</h3>
            <p class="text-xs text-zinc-500 font-num">${count} Hareket</p>
          </div>
          <span class="text-xs font-bold text-blue-400 bg-blue-600/15 border border-blue-500/20 px-3.5 py-1.5 rounded-xl font-num">Aç ›</span>
        `;
        container.appendChild(card);
      });
    }

    // --- PROGRAM MODALI ---
    function openNewRoutineModal() {
      const modal = document.getElementById("newRoutineModal");
      const input = document.getElementById("newRoutineInput");
      input.value = "";
      modal.classList.remove("hidden");
      lockScroll();
      setTimeout(() => input.focus(), 80);
    }

    function closeNewRoutineModal() {
      document.getElementById("newRoutineModal").classList.add("hidden");
      unlockScroll();
    }

    function submitNewRoutine() {
      const input = document.getElementById("newRoutineInput");
      const name = input.value.trim();
      if (!name) return;

      const newRoutine = { id: "r_" + Date.now(), name: name, exerciseIds: [] };
      routines.push(newRoutine);
      saveRoutines();
      closeNewRoutineModal();
      
      // Animasyonlu akıcı geçiş
      setTimeout(() => {
        openWorkout(newRoutine.id);
      }, 100);
    }

    // --- HAREKET MODALI ---
    function openNewExerciseModal() {
      document.getElementById("newExNameInput").value = "";
      document.getElementById("newExMuscleInput").value = "";
      document.getElementById("newExerciseModal").classList.remove("hidden");
    }

    function closeNewExerciseModal() {
      document.getElementById("newExerciseModal").classList.add("hidden");
    }

    function submitNewExercise() {
      const name = document.getElementById("newExNameInput").value.trim();
      const muscle = document.getElementById("newExMuscleInput").value.trim() || "Genel";
      if (!name) return;

      const newEx = { id: "ex_" + Date.now(), name: name, muscle: muscle };
      globalExercisePool.push(newEx);
      savePool();

      tempSelectedExerciseIds.push(newEx.id);
      closeNewExerciseModal();
      renderPickerList();
    }

    function deleteCurrentRoutine() {
      if (confirm("Bu programı tamamen silmek istiyor musun?")) {
        routines = routines.filter(r => r.id !== currentRoutineId);
        saveRoutines();
        goHome();
      }
    }

    // --- ANTRENMAN RENDER ---
    function renderWorkout(animate = false) {
      const routine = routines.find(r => r.id === currentRoutineId);
      if (!routine) return goHome();

      document.getElementById("workoutTitle").innerText = routine.name;
      document.getElementById("workoutSubtitle").innerText = `${routine.exerciseIds.length} Egzersiz`;

      const container = document.getElementById("routineContainer");
      container.innerHTML = "";

      if (routine.exerciseIds.length === 0) {
        container.innerHTML = `
          <div class="bg-zinc-950 border border-zinc-900 rounded-[28px] p-6 text-center mt-3">
            <p class="text-xs text-zinc-400 mb-1 font-semibold">Bu program henüz boş.</p>
            <p class="text-[11px] text-zinc-600 font-medium">Alttaki butona basarak hareket ekleyebilirsin.</p>
          </div>
        `;
        updateCompletedCounter();
        return;
      }

      routine.exerciseIds.forEach((exId, exIndex) => {
        const ex = globalExercisePool.find(e => e.id === exId);
        if (!ex) return;

        initActiveSetsForExercise(exId);
        const sets = activeSets[exId] || [];
        const hist = getHistory(exId);
        const lastRec = hist[hist.length - 1];

        const card = document.createElement("div");
        card.className = `bg-zinc-950 border border-zinc-850 rounded-[24px] p-4 shadow-lg ${animate ? 'animate-card' : ''}`;
        if (animate) {
          card.style.animationDelay = `${exIndex * 50}ms`;
        }

        let setsHtml = "";
        sets.forEach((set, idx) => {
          const isDone = set.done;
          setsHtml += `
            <div class="grid grid-cols-[22px_1fr_1fr_52px_36px] gap-2 items-center bg-zinc-900/60 p-2 rounded-xl border ${isDone ? 'border-blue-500/50 bg-blue-950/20' : 'border-zinc-800/60'} transition">
              <span class="text-[11px] font-bold ${isDone ? 'text-blue-400' : 'text-zinc-500'} text-center font-num">${idx + 1}</span>
              
              <input type="text" placeholder="${lastRec ? lastRec.kg : 'KG'}" value="${set.kg}" onchange="updateSetVal('${ex.id}', ${idx}, 'kg', this.value)" class="w-full bg-black/90 border border-zinc-800 rounded-lg p-2 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-num font-bold">
              
              <input type="text" placeholder="${lastRec ? lastRec.reps : 'Rep'}" value="${set.reps}" onchange="updateSetVal('${ex.id}', ${idx}, 'reps', this.value)" class="w-full bg-black/90 border border-zinc-800 rounded-lg p-2 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-num font-bold">
              
              <select onchange="updateSetVal('${ex.id}', ${idx}, 'type', this.value)" class="w-full bg-black/90 border border-zinc-800 rounded-lg p-2 text-center text-[10px] font-extrabold ${set.type === 'F' ? 'text-rose-400' : 'text-zinc-300'} focus:outline-none font-num">
                <option value="Norm" ${set.type === 'Norm' ? 'selected' : ''}>OK</option>
                <option value="F" ${set.type === 'F' ? 'selected' : ''}>F</option>
                <option value="R1" ${set.type === 'R1' ? 'selected' : ''}>R1</option>
                <option value="R2" ${set.type === 'R2' ? 'selected' : ''}>R2</option>
              </select>
              
              <button onclick="toggleSet('${ex.id}', ${idx})" class="tap-press w-9 h-9 rounded-xl font-extrabold flex items-center justify-center text-xs transition ${isDone ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'bg-zinc-800 text-zinc-500'}">✓</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="cursor-pointer" onclick="openDetailModal('${ex.id}')">
              <h3 class="text-blue-400 font-extrabold text-sm hover:underline leading-tight tracking-tight">${ex.name}</h3>
              <p class="text-[10px] text-zinc-500 font-medium mt-0.5">${ex.muscle}</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="openDetailModal('${ex.id}')" class="tap-press text-[10px] text-zinc-400 bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-lg font-num font-semibold">Grafik</button>
              <button onclick="removeExerciseFromRoutine('${ex.id}')" class="tap-press text-zinc-600 hover:text-rose-400 text-xs px-2 py-1">✕</button>
            </div>
          </div>
          <div class="space-y-1 mb-2.5">
            <div class="grid grid-cols-[22px_1fr_1fr_52px_36px] gap-2 text-zinc-500 font-num text-[9px] px-1 text-center font-bold">
              <span>S</span><span>KG</span><span>REP</span><span>TÜR</span><span>TİK</span>
            </div>
            ${setsHtml}
          </div>
          <div class="flex justify-between items-center pt-2 border-t border-zinc-900/80">
            <button onclick="addSet('${ex.id}')" class="tap-press text-[11px] font-bold text-blue-400 py-1 px-2">+ Set Ekle</button>
            <button onclick="removeSet('${ex.id}')" class="tap-press text-[10px] text-zinc-500 hover:text-rose-400 py-1 px-2 font-medium">- Set Sil</button>
          </div>
        `;
        container.appendChild(card);
      });
      updateCompletedCounter();
    }

    function initActiveSetsForExercise(exId) {
      if (!activeSets[exId]) {
        const hist = getHistory(exId);
        const last = hist[hist.length - 1];
        activeSets[exId] = [
          { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "Norm", done: false },
          { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "F", done: false }
        ];
      }
    }

    function updateSetVal(exId, idx, field, val) {
      if (activeSets[exId] && activeSets[exId][idx]) {
        activeSets[exId][idx][field] = val;
        saveActiveSets();
      }
    }

    function addSet(exId) {
      const sets = activeSets[exId] || [];
      const prev = sets[sets.length - 1];
      sets.push({ kg: prev ? prev.kg : "", reps: prev ? prev.reps : "", type: "Norm", done: false });
      activeSets[exId] = sets;
      saveActiveSets();
      renderWorkout(false);
    }

    function removeSet(exId) {
      if (activeSets[exId] && activeSets[exId].length > 1) {
        activeSets[exId].pop();
        saveActiveSets();
        renderWorkout(false);
      }
    }

    function toggleSet(exId, idx) {
      const set = activeSets[exId][idx];
      if (!set.kg) { alert("Lütfen ağırlık yazın!"); return; }
      set.done = !set.done;
      saveActiveSets();

      if (set.done) {
        const hist = getHistory(exId);
        const date = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        hist.push({ date, kg: set.kg, reps: set.reps || "8", type: set.type });
        saveHistory(exId, hist);
      }
      renderWorkout(false);
    }

    function removeExerciseFromRoutine(exId) {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;
      current.exerciseIds = current.exerciseIds.filter(id => id !== exId);
      saveRoutines();
      renderWorkout(false);
    }

    function updateCompletedCounter() {
      const current = routines.find(r => r.id === currentRoutineId);
      let totalDone = 0;
      if (current) {
        current.exerciseIds.forEach(exId => {
          const sets = activeSets[exId] || [];
          sets.forEach(s => { if (s.done) totalDone++; });
        });
      }
      document.getElementById("completedCounter").innerText = `${totalDone} Set`;
    }

    // --- HAVUZDAN ÇOKLU SEÇİM ---
    function openExerciseSelector() {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;

      tempSelectedExerciseIds = [...current.exerciseIds];
      renderPickerList();
      document.getElementById("exercisePickerModal").classList.remove("hidden");
      lockScroll();
    }

    function closeExerciseSelector() {
      document.getElementById("exercisePickerModal").classList.add("hidden");
      unlockScroll();
    }

    function renderPickerList() {
      const list = document.getElementById("pickerList");
      list.innerHTML = "";

      globalExercisePool.forEach(ex => {
        const isSelected = tempSelectedExerciseIds.includes(ex.id);
        const item = document.createElement("div");
        item.className = `tap-press flex items-center justify-between p-3.5 rounded-2xl border cursor-pointer ${isSelected ? 'bg-blue-600/15 border-blue-500 shadow-md shadow-blue-500/10' : 'bg-black/80 border-zinc-800'}`;
        item.onclick = () => toggleTempSelection(ex.id);
        item.innerHTML = `
          <div>
            <p class="font-extrabold text-white text-xs tracking-tight">${ex.name}</p>
            <p class="text-[10px] text-zinc-500 font-medium mt-0.5">${ex.muscle}</p>
          </div>
          <div class="w-7 h-7 rounded-xl flex items-center justify-center font-extrabold text-xs transition ${isSelected ? 'bg-blue-600 text-white shadow-sm' : 'bg-zinc-850 text-zinc-500'}">
            ${isSelected ? '✓' : '+'}
          </div>
        `;
        list.appendChild(item);
      });

      document.getElementById("btnConfirmSelect").innerText = `${tempSelectedExerciseIds.length} Hareketi Programa Kaydet`;
    }

    function toggleTempSelection(exId) {
      if (tempSelectedExerciseIds.includes(exId)) {
        tempSelectedExerciseIds = tempSelectedExerciseIds.filter(id => id !== exId);
      } else {
        tempSelectedExerciseIds.push(exId);
      }
      renderPickerList();
    }

    function saveSelectedExercises() {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;

      current.exerciseIds = [...tempSelectedExerciseIds];
      saveRoutines();
      closeExerciseSelector();
      renderWorkout(true);
    }

    // --- DETAY MODALI ---
    function openDetailModal(exId) {
      const ex = globalExercisePool.find(e => e.id === exId);
      if (!ex) return;

      document.getElementById("modalExTitle").innerText = ex.name;
      document.getElementById("modalExMuscle").innerText = ex.muscle;

      const hist = getHistory(exId);
      const histContainer = document.getElementById("historyList");
      histContainer.innerHTML = "";

      if (hist.length === 0) {
        histContainer.innerHTML = `<p class="text-zinc-500 text-xs py-3 text-center font-medium">Henüz tamamlanan set kaydı yok.</p>`;
      } else {
        [...hist].reverse().forEach(h => {
          const row = document.createElement("div");
          row.className = "flex justify-between items-center bg-black/80 p-2.5 rounded-xl border border-zinc-800 text-[11px] font-num";
          row.innerHTML = `<span class="text-zinc-500 font-medium">${h.date}</span><span class="font-bold text-white">${h.kg} KG</span><span class="text-zinc-400 font-medium">${h.reps} Rep</span><span class="${h.type === 'F' ? 'text-rose-400' : 'text-zinc-400'} font-extrabold">[${h.type}]</span>`;
          histContainer.appendChild(row);
        });
      }

      const ctx = document.getElementById('exerciseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = hist.map(h => h.date);
      const dataPoints = hist.map(h => {
        const nums = h.kg.match(/\d+(\.\d+)?/g);
        return nums ? nums.reduce((a, b) => parseFloat(a) + parseFloat(b), 0) : 0;
      });

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.slice(-8),
          datasets: [{
            data: dataPoints.slice(-8),
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.12)',
            borderWidth: 2.5,
            tension: 0.35,
            fill: true,
            pointBackgroundColor: '#2563eb',
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717a', font: { family: 'JetBrains Mono', size: 9 } } },
            y: { grid: { color: '#18181b' }, ticks: { color: '#71717a', font: { family: 'JetBrains Mono', size: 9 } } }
          }
        }
      });

      document.getElementById("detailModal").classList.remove("hidden");
      lockScroll();
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.add("hidden");
      unlockScroll();
    }

    goHome();
  </script>
</body>
</html>
