<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Antrenman Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen pb-24 font-sans select-none">

  <!-- Üst Bar -->
  <header class="p-4 pt-6 border-b border-zinc-900 sticky top-0 bg-black/90 backdrop-blur-md z-40 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-white">Upper Body</h1>
      <p class="text-[11px] text-zinc-400">Omuz, Göğüs, Sırt, Kol</p>
    </div>
    <span class="text-xs bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2.5 py-1 rounded-full font-semibold">Aktif Antrenman</span>
  </header>

  <!-- Egzersiz Listesi -->
  <main id="routineContainer" class="p-3 space-y-4 max-w-lg mx-auto"></main>

  <!-- Detay Modalı (Grafik + Geçmiş + Video) -->
  <div id="detailModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-zinc-900 border border-zinc-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h2 id="modalExTitle" class="text-lg font-bold text-white leading-tight"></h2>
          <span id="modalExMuscle" class="text-xs text-blue-400 font-medium"></span>
        </div>
        <button onclick="closeDetailModal()" class="text-zinc-400 hover:text-white text-xl font-bold p-1">✕</button>
      </div>

      <!-- Video / Yapılış Linki -->
      <div id="videoContainer" class="mb-4 hidden">
        <a id="videoLink" href="#" target="_blank" class="flex items-center justify-between bg-zinc-800/80 border border-zinc-700 p-2.5 rounded-xl text-xs text-zinc-200 hover:border-blue-500 transition">
          <span class="flex items-center gap-2">
            <span class="text-rose-500 font-bold">▶</span> Yapılış Videosunu İzle (Zaman Ayarlı)
          </span>
          <span class="text-zinc-400">›</span>
        </a>
      </div>

      <!-- İlerleme Grafiği -->
      <div class="bg-black border border-zinc-800 rounded-xl p-3 mb-4">
        <h4 class="text-[11px] font-semibold text-zinc-400 mb-2">AĞIRLIK İLERLEMESİ (KG)</h4>
        <canvas id="exerciseChart" height="170"></canvas>
      </div>

      <!-- Geçmiş Kayıtlar -->
      <div>
        <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Geçmiş Kayıtlar</h3>
        <div id="historyList" class="space-y-1.5 max-h-48 overflow-y-auto text-xs"></div>
      </div>
    </div>
  </div>

  <script>
    // Ortak Egzersiz Havuzu (Ağırlık geçmişi buraya yazılır, başka programa eklesen de veriler buradan gelir)
    const exercisePool = [
      { id: "sp", name: "Shoulder Press", muscle: "Ön / Yan Omuz", videoUrl: "https://www.youtube.com" },
      { id: "clr", name: "Cable Lateral Raise", muscle: "Yan Omuz", videoUrl: "https://www.youtube.com" },
      { id: "bp", name: "Bench Press", muscle: "Göğüs, Ön Omuz, Triceps", videoUrl: "https://www.youtube.com" },
      { id: "cf", name: "Cable Fly", muscle: "Göğüs", videoUrl: "https://www.youtube.com" },
      { id: "scr", name: "Seated Cable Row", muscle: "Sırt, Lat", videoUrl: "https://www.youtube.com" },
      { id: "lp", name: "Lat Pulldown", muscle: "Sırt, Biceps", videoUrl: "https://www.youtube.com" },
      { id: "tb", name: "Triceps Bar Baş Üstü", muscle: "Triceps", videoUrl: "https://www.youtube.com" },
      { id: "btk", name: "Biceps Tek Kol", muscle: "Biceps", videoUrl: "https://www.youtube.com" }
    ];

    let chartInstance = null;

    // LocalStorage Yardımcıları
    function getHistory(exId) {
      return JSON.parse(localStorage.getItem(`history_${exId}`) || "[]");
    }

    function saveHistory(exId, history) {
      localStorage.setItem(`history_${exId}`, JSON.stringify(history));
    }

    // Uygulamayı Çiz
    function renderApp() {
      const container = document.getElementById("routineContainer");
      container.innerHTML = "";

      exercisePool.forEach((ex) => {
        const history = getHistory(ex.id);
        const lastEntry = history[history.length - 1];
        const defaultKg = lastEntry ? lastEntry.kg : "";
        const defaultReps = lastEntry ? lastEntry.reps : "";

        const card = document.createElement("div");
        card.className = "bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4";
        card.innerHTML = `
          <div class="flex items-center justify-between mb-3 cursor-pointer" onclick="openDetailModal('${ex.id}')">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-blue-600/20 text-blue-400 font-bold flex items-center justify-center text-xs">
                ${ex.name.charAt(0)}
              </div>
              <div>
                <h3 class="text-blue-400 font-bold text-sm hover:underline">${ex.name}</h3>
                <p class="text-[11px] text-zinc-400">${ex.muscle}</p>
              </div>
            </div>
            <span class="text-xs text-zinc-500 font-mono">Detay ›</span>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between text-zinc-500 font-mono text-[10px] px-1">
              <span class="w-8">SET</span>
              <span class="flex-1 text-center">KG / DUMBBELL</span>
              <span class="flex-1 text-center">TEKRAR</span>
              <span class="w-14 text-center">DURUM</span>
              <span class="w-8 text-right">TİK</span>
            </div>

            <div class="flex items-center gap-1.5 bg-black/60 p-2 rounded-xl border border-zinc-800/80">
              <span class="w-8 text-xs font-bold text-zinc-400">1</span>
              <input id="kg_${ex.id}" type="text" placeholder="${defaultKg || 'KG'}" value="${defaultKg || ''}" class="flex-1 bg-zinc-800/80 border border-zinc-700 rounded-lg p-1.5 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              <input id="rep_${ex.id}" type="text" placeholder="${defaultReps || 'Tekrar'}" value="${defaultReps || ''}" class="flex-1 bg-zinc-800/80 border border-zinc-700 rounded-lg p-1.5 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              
              <!-- Durum (Tükeniş / RIR) -->
              <select id="status_${ex.id}" class="w-14 bg-zinc-800/80 border border-zinc-700 rounded-lg p-1.5 text-center text-[10px] font-bold text-rose-400 focus:outline-none">
                <option value="F" selected>F</option>
                <option value="RIR1">R1</option>
                <option value="RIR2">R2</option>
                <option value="Norm">OK</option>
              </select>

              <!-- Tik Butonu -->
              <button onclick="toggleSet('${ex.id}', this)" class="w-8 h-8 rounded-lg bg-zinc-800 text-zinc-500 font-bold flex items-center justify-center text-xs transition active:scale-90">✓</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Set Tikleme ve Havuza Kayıt
    function toggleSet(exId, btn) {
      const kg = document.getElementById(`kg_${exId}`).value.trim();
      const reps = document.getElementById(`rep_${exId}`).value.trim();
      const status = document.getElementById(`status_${exId}`).value;

      if (!kg) {
        alert("Lütfen ağırlık girin!");
        return;
      }

      const isCompleted = btn.classList.contains("bg-blue-600");
      if (!isCompleted) {
        btn.className = "w-8 h-8 rounded-lg bg-blue-600 text-white font-bold flex items-center justify-center text-xs shadow-lg shadow-blue-600/30";
        
        // Geçmişe ekle
        const history = getHistory(exId);
        const date = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        history.push({ date, kg, reps: reps || "8", status });
        saveHistory(exId, history);
      } else {
        btn.className = "w-8 h-8 rounded-lg bg-zinc-800 text-zinc-500 font-bold flex items-center justify-center text-xs";
      }
    }

    // Detay Modalını Aç
    function openDetailModal(exId) {
      const ex = exercisePool.find(e => e.id === exId);
      if (!ex) return;

      document.getElementById("modalExTitle").innerText = ex.name;
      document.getElementById("modalExMuscle").innerText = ex.muscle;

      // Video Linki
      const videoBox = document.getElementById("videoContainer");
      if (ex.videoUrl) {
        videoBox.classList.remove("hidden");
        document.getElementById("videoLink").href = ex.videoUrl;
      } else {
        videoBox.classList.add("hidden");
      }

      // Geçmiş Listesi
      const history = getHistory(exId);
      const historyContainer = document.getElementById("historyList");
      historyContainer.innerHTML = "";

      if (history.length === 0) {
        historyContainer.innerHTML = `<p class="text-zinc-500 text-xs py-2 text-center">Henüz kaydedilmiş set yok.</p>`;
      } else {
        [...history].reverse().forEach(h => {
          const item = document.createElement("div");
          item.className = "flex justify-between items-center bg-black/60 p-2 rounded-lg border border-zinc-800 text-xs font-mono";
          item.innerHTML = `
            <span class="text-zinc-400">${h.date}</span>
            <span class="font-bold text-white">${h.kg} KG</span>
            <span class="text-zinc-400">${h.reps} Tekrar</span>
            <span class="text-rose-400 font-bold">[${h.status}]</span>
          `;
          historyContainer.appendChild(item);
        });
      }

      // Grafik
      const ctx = document.getElementById('exerciseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = history.map(h => h.date);
      const dataPoints = history.map(h => {
        const nums = h.kg.match(/\d+(\.\d+)?/g);
        if (!nums) return 0;
        return nums.reduce((a, b) => parseFloat(a) + parseFloat(b), 0);
      });

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.slice(-8),
          datasets: [{
            data: dataPoints.slice(-8),
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            borderWidth: 2,
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717a', font: { size: 10 } } },
            y: { grid: { color: '#18181b' }, ticks: { color: '#71717a', font: { size: 10 } } }
          }
        }
      });

      document.getElementById("detailModal").classList.remove("hidden");
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.add("hidden");
    }

    renderApp();
  </script>
</body>
</html>
