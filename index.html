<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Antrenman Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 44px);
    }
    body {
      padding-top: var(--sat);
      background-color: #000000;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="min-h-screen pb-32">

  <!-- Üst Bar (iPhone Çentik Uyumlu) -->
  <header class="px-4 py-3 border-b border-zinc-900 bg-black/95 sticky top-0 z-30 flex justify-between items-center">
    <div>
      <h1 id="currentRoutineName" class="text-lg font-bold text-white leading-tight">Program Yok</h1>
      <p class="text-[10px] text-zinc-500">iPhone 13 Görünümü</p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="createNewRoutine()" class="text-xs bg-blue-600 active:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-lg shadow-sm">+ Yeni Program</button>
      <button onclick="forceCleanReload()" title="Telefonda Yenile" class="text-xs bg-zinc-800 text-zinc-400 p-1.5 rounded-lg">🔄</button>
    </div>
  </header>

  <!-- Rutin Sekmeleri -->
  <div id="routineTabs" class="flex gap-2 px-4 py-2 border-b border-zinc-900 overflow-x-auto text-xs font-semibold no-scrollbar"></div>

  <div class="px-3 max-w-md mx-auto">

    <!-- Hevy Tarzı Beyaz Zeminli Anatomik Adam Kartı -->
    <section class="mt-3 bg-white rounded-2xl p-3 shadow-lg border border-zinc-200 text-zinc-900">
      <div class="flex justify-between items-center mb-2 px-1">
        <span class="text-[10px] font-black tracking-wider text-zinc-400 uppercase">HEDEF KASLAR</span>
        <span id="activeMuscleLabel" class="text-[10px] font-bold text-blue-600 font-mono">Tüm Vücut</span>
      </div>

      <!-- İstediğin Medikal Kaslı Adam Görselleri (Ön & Arka) -->
      <div class="grid grid-cols-2 gap-2 bg-zinc-50 border border-zinc-200/80 rounded-xl p-2 items-center">
        <!-- Ön Görünüş -->
        <div class="flex flex-col items-center">
          <span class="text-[9px] font-extrabold text-zinc-400 mb-1">ÖN</span>
          <div class="relative w-28 h-44 flex items-center justify-center overflow-hidden">
            <img id="frontBodyImg" 
                 src="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press_-_Medium_Grip/0.jpg" 
                 onerror="this.src='https://images.squarespace-cdn.com/content/v1/599e69c1be42d0577e383162/1507693998816-4N72U4O3FOPW6R91P896/male-muscles-front.png'" 
                 class="w-full h-full object-contain filter contrast-125" alt="Ön Kas">
          </div>
        </div>

        <!-- Arka Görünüş -->
        <div class="flex flex-col items-center border-l border-zinc-200 pl-2">
          <span class="text-[9px] font-extrabold text-zinc-400 mb-1">ARKA</span>
          <div class="relative w-28 h-44 flex items-center justify-center overflow-hidden">
            <img id="backBodyImg" 
                 src="https://images.squarespace-cdn.com/content/v1/599e69c1be42d0577e383162/1507694000302-36I1P6P085P7J68U9W36/male-muscles-back.png" 
                 onerror="this.src='https://cdn-icons-png.flaticon.com/512/3043/3043890.png'" 
                 class="w-full h-full object-contain filter contrast-125" alt="Arka Kas">
          </div>
        </div>
      </div>

      <!-- Set Sayaçları -->
      <div class="grid grid-cols-4 gap-1 mt-2 text-center font-mono">
        <div class="bg-zinc-100 p-1 rounded-lg">
          <span class="block text-[8px] text-zinc-500 font-sans font-bold">GÖĞÜS</span>
          <span id="cnt-gogus" class="text-xs font-bold text-zinc-800">0</span>
        </div>
        <div class="bg-zinc-100 p-1 rounded-lg">
          <span class="block text-[8px] text-zinc-500 font-sans font-bold">OMUZ</span>
          <span id="cnt-omuz" class="text-xs font-bold text-zinc-800">0</span>
        </div>
        <div class="bg-zinc-100 p-1 rounded-lg">
          <span class="block text-[8px] text-zinc-500 font-sans font-bold">SIRT</span>
          <span id="cnt-sirt" class="text-xs font-bold text-zinc-800">0</span>
        </div>
        <div class="bg-zinc-100 p-1 rounded-lg">
          <span class="block text-[8px] text-zinc-500 font-sans font-bold">KOL</span>
          <span id="cnt-kol" class="text-xs font-bold text-zinc-800">0</span>
        </div>
      </div>
    </section>

    <!-- Hareket Listesi -->
    <main id="routineContainer" class="mt-3 space-y-3"></main>

    <!-- Alt İşlem Butonları -->
    <div id="actionButtons" class="mt-4 space-y-2 hidden">
      <button onclick="openExerciseSelector()" class="w-full py-3.5 rounded-xl bg-blue-600 text-white font-bold text-xs flex items-center justify-center gap-1 active:bg-blue-700 shadow-md">
        <span>+</span> Programa Hareket Ekle
      </button>
      <button onclick="promptCreateNewExercise()" class="w-full py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 font-semibold text-xs active:bg-zinc-800">
        Özel Hareket Oluştur
      </button>
    </div>
  </div>

  <!-- Detay Modalı -->
  <div id="detailModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-end justify-center">
    <div class="bg-zinc-900 border-t border-zinc-800 w-full rounded-t-3xl p-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h2 id="modalExTitle" class="text-base font-bold text-white leading-tight"></h2>
          <span id="modalExMuscle" class="text-[11px] text-blue-400 font-medium"></span>
        </div>
        <button onclick="closeDetailModal()" class="text-zinc-400 text-xl font-bold px-2">✕</button>
      </div>

      <div class="bg-black border border-zinc-800 rounded-xl p-2.5 mb-3">
        <h4 class="text-[10px] font-semibold text-zinc-400 mb-1">AĞIRLIK GELİŞİM GRAFİĞİ (KG)</h4>
        <canvas id="exerciseChart" height="150"></canvas>
      </div>

      <div>
        <h3 class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Geçmiş Kayıtlar</h3>
        <div id="historyList" class="space-y-1.5 max-h-40 overflow-y-auto text-xs"></div>
      </div>
    </div>
  </div>

  <!-- Egzersiz Seçim Modalı -->
  <div id="exercisePickerModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-end justify-center">
    <div class="bg-zinc-900 border-t border-zinc-800 w-full rounded-t-3xl p-4 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm font-bold text-white">Havuzdan Egzersiz Seç</h2>
        <button onclick="closeExerciseSelector()" class="text-zinc-400 text-xl font-bold px-2">✕</button>
      </div>
      <div id="pickerList" class="space-y-2 overflow-y-auto flex-1 py-1"></div>
      <button onclick="promptCreateNewExercise()" class="mt-2 w-full py-2.5 rounded-xl bg-zinc-800 text-blue-400 text-xs font-bold border border-zinc-700">
        + Yeni Hareket Ekle
      </button>
    </div>
  </div>

  <script>
    let globalExercisePool = JSON.parse(localStorage.getItem("fit_pool")) || [
      { id: "sp", name: "Shoulder Press", muscle: "Omuz", tag: "omuz" },
      { id: "clr", name: "Cable Lateral Raise", muscle: "Omuz", tag: "omuz" },
      { id: "bp", name: "Bench Press", muscle: "Göğüs", tag: "gogus" },
      { id: "cf", name: "Cable Fly", muscle: "Göğüs", tag: "gogus" },
      { id: "scr", name: "Seated Cable Row", muscle: "Sırt", tag: "sirt" },
      { id: "lp", name: "Lat Pulldown", muscle: "Sırt", tag: "sirt" },
      { id: "tb", name: "Triceps Bar Baş Üstü", muscle: "Triceps", tag: "kol" },
      { id: "btk", name: "Biceps Tek Kol", muscle: "Biceps", tag: "kol" }
    ];

    let routines = JSON.parse(localStorage.getItem("fit_routines")) || [];
    let currentRoutineId = localStorage.getItem("fit_current_routine") || (routines[0] ? routines[0].id : null);
    let chartInstance = null;

    function forceCleanReload() {
      if (confirm("Uygulama sıfırlanıp en güncel sürüme yenilensin mi?")) {
        localStorage.clear();
        window.location.reload(true);
      }
    }

    function savePool() { localStorage.setItem("fit_pool", JSON.stringify(globalExercisePool)); }
    function saveRoutines() { localStorage.setItem("fit_routines", JSON.stringify(routines)); }
    function getHistory(exId) { return JSON.parse(localStorage.getItem(`fit_history_${exId}`) || "[]"); }
    function saveHistory(exId, history) { localStorage.setItem(`fit_history_${exId}`, JSON.stringify(history)); }

    let activeSets = JSON.parse(localStorage.getItem("fit_active_sets") || "{}");

    function saveActiveSets() {
      localStorage.setItem("fit_active_sets", JSON.stringify(activeSets));
      updateAnalytics();
    }

    function initActiveSetsForExercise(exId) {
      if (!activeSets[exId]) {
        const hist = getHistory(exId);
        const last = hist[hist.length - 1];
        activeSets[exId] = [
          { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "Norm", done: false },
          { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "F", done: false }
        ];
      }
    }

    function renderTabs() {
      const container = document.getElementById("routineTabs");
      container.innerHTML = "";

      if (routines.length === 0) {
        document.getElementById("currentRoutineName").innerText = "Program Yok";
        return;
      }

      routines.forEach(r => {
        const isActive = r.id === currentRoutineId;
        const btn = document.createElement("button");
        btn.className = `px-3.5 py-1.5 rounded-xl whitespace-nowrap transition border ${isActive ? 'bg-blue-600 border-blue-500 text-white' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`;
        btn.innerText = r.name;
        btn.onclick = () => switchRoutine(r.id);
        container.appendChild(btn);
      });

      const current = routines.find(r => r.id === currentRoutineId);
      if (current) document.getElementById("currentRoutineName").innerText = current.name;
    }

    function switchRoutine(id) {
      currentRoutineId = id;
      localStorage.setItem("fit_current_routine", id);
      renderTabs();
      renderApp();
    }

    function createNewRoutine() {
      const name = prompt("Program Adı (Örn: Upper Body):");
      if (!name || !name.trim()) return;

      const newId = "r_" + Date.now();
      routines.push({ id: newId, name: name.trim(), exerciseIds: [] });
      saveRoutines();
      switchRoutine(newId);
    }

    function promptCreateNewExercise() {
      const name = prompt("Yeni Hareketin Adı:");
      if (!name || !name.trim()) return;

      const region = prompt("Bölge (gogus, omuz, sirt, kol):", "gogus");
      const tag = region ? region.trim().toLowerCase() : "gogus";

      const newEx = { id: "ex_" + Date.now(), name: name.trim(), muscle: tag.toUpperCase(), tag: tag };
      globalExercisePool.push(newEx);
      savePool();

      if (currentRoutineId) {
        const current = routines.find(r => r.id === currentRoutineId);
        if (current && !current.exerciseIds.includes(newEx.id)) {
          current.exerciseIds.push(newEx.id);
          saveRoutines();
        }
      }
      closeExerciseSelector();
      renderApp();
    }

    function renderApp() {
      renderTabs();
      const container = document.getElementById("routineContainer");
      const actionBox = document.getElementById("actionButtons");
      container.innerHTML = "";

      if (routines.length === 0) {
        actionBox.classList.add("hidden");
        container.innerHTML = `
          <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-6 text-center mt-3">
            <h3 class="text-sm font-bold text-white mb-1">Henüz Program Yok</h3>
            <p class="text-xs text-zinc-400 mb-3">Yukarıdaki "+ Yeni Program" butonuna basarak başla.</p>
          </div>
        `;
        updateAnalytics();
        return;
      }

      actionBox.classList.remove("hidden");
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;

      if (current.exerciseIds.length === 0) {
        container.innerHTML = `
          <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-5 text-center mt-2">
            <p class="text-xs text-zinc-400 mb-2">Bu program henüz boş.</p>
            <button onclick="openExerciseSelector()" class="px-3 py-1.5 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-lg text-xs font-bold">Havuzdan Ekle</button>
          </div>
        `;
        updateAnalytics();
        return;
      }

      current.exerciseIds.forEach(exId => {
        const ex = globalExercisePool.find(e => e.id === exId);
        if (!ex) return;

        initActiveSetsForExercise(exId);
        const sets = activeSets[exId] || [];
        const hist = getHistory(exId);
        const lastRec = hist[hist.length - 1];

        const card = document.createElement("div");
        card.className = "bg-zinc-950 border border-zinc-800/80 rounded-2xl p-3";

        let setsHtml = "";
        sets.forEach((set, idx) => {
          const isDone = set.done;
          setsHtml += `
            <div class="grid grid-cols-[20px_1fr_1fr_48px_32px] gap-1.5 items-center bg-zinc-900/60 p-1.5 rounded-lg border ${isDone ? 'border-blue-500/50 bg-blue-950/20' : 'border-zinc-800/60'}">
              <span class="text-[11px] font-bold ${isDone ? 'text-blue-400' : 'text-zinc-500'} text-center font-mono">${idx + 1}</span>
              <input type="text" placeholder="${lastRec ? lastRec.kg : 'KG'}" value="${set.kg}" onchange="updateSetVal('${ex.id}', ${idx}, 'kg', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              <input type="text" placeholder="${lastRec ? lastRec.reps : 'Tekrar'}" value="${set.reps}" onchange="updateSetVal('${ex.id}', ${idx}, 'reps', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              <select onchange="updateSetVal('${ex.id}', ${idx}, 'type', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-center text-[10px] font-bold ${set.type === 'F' ? 'text-rose-400' : 'text-zinc-300'} focus:outline-none">
                <option value="Norm" ${set.type === 'Norm' ? 'selected' : ''}>OK</option>
                <option value="F" ${set.type === 'F' ? 'selected' : ''}>F</option>
                <option value="R1" ${set.type === 'R1' ? 'selected' : ''}>R1</option>
                <option value="R2" ${set.type === 'R2' ? 'selected' : ''}>R2</option>
              </select>
              <button onclick="toggleSet('${ex.id}', ${idx})" class="w-8 h-7 rounded font-bold flex items-center justify-center text-xs transition active:scale-95 ${isDone ? 'bg-blue-600 text-white' : 'bg-zinc-800 text-zinc-500'}">✓</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <div class="cursor-pointer" onclick="openDetailModal('${ex.id}')">
              <h3 class="text-blue-400 font-bold text-xs hover:underline">${ex.name}</h3>
              <p class="text-[10px] text-zinc-500">${ex.muscle}</p>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="openDetailModal('${ex.id}')" class="text-[10px] text-zinc-400 bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded">Grafik</button>
              <button onclick="removeExerciseFromRoutine('${ex.id}')" class="text-zinc-600 hover:text-rose-400 text-xs px-1">✕</button>
            </div>
          </div>
          <div class="space-y-1 mb-2">
            <div class="grid grid-cols-[20px_1fr_1fr_48px_32px] gap-1.5 text-zinc-500 font-mono text-[9px] px-1 text-center">
              <span>S</span><span>KG</span><span>REP</span><span>TÜR</span><span>TİK</span>
            </div>
            ${setsHtml}
          </div>
          <div class="flex justify-between items-center pt-1 border-t border-zinc-900">
            <button onclick="addSet('${ex.id}')" class="text-[11px] font-semibold text-blue-400 py-0.5 px-1.5">+ Set</button>
            <button onclick="removeSet('${ex.id}')" class="text-[10px] text-zinc-500 hover:text-rose-400 py-0.5 px-1.5">- Sil</button>
          </div>
        `;
        container.appendChild(card);
      });
      updateAnalytics();
    }

    function updateSetVal(exId, idx, field, val) {
      if (activeSets[exId] && activeSets[exId][idx]) {
        activeSets[exId][idx][field] = val;
        saveActiveSets();
      }
    }

    function addSet(exId) {
      const sets = activeSets[exId] || [];
      const prev = sets[sets.length - 1];
      sets.push({ kg: prev ? prev.kg : "", reps: prev ? prev.reps : "", type: "Norm", done: false });
      activeSets[exId] = sets;
      saveActiveSets();
      renderApp();
    }

    function removeSet(exId) {
      if (activeSets[exId] && activeSets[exId].length > 1) {
        activeSets[exId].pop();
        saveActiveSets();
        renderApp();
      }
    }

    function toggleSet(exId, idx) {
      const set = activeSets[exId][idx];
      if (!set.kg) { alert("Ağırlık yazmalısın!"); return; }
      set.done = !set.done;
      saveActiveSets();

      if (set.done) {
        const hist = getHistory(exId);
        const date = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        hist.push({ date, kg: set.kg, reps: set.reps || "8", type: set.type });
        saveHistory(exId, hist);
      }
      renderApp();
    }

    function removeExerciseFromRoutine(exId) {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;
      current.exerciseIds = current.exerciseIds.filter(id => id !== exId);
      saveRoutines();
      renderApp();
    }

    function openExerciseSelector() {
      const modal = document.getElementById("exercisePickerModal");
      const list = document.getElementById("pickerList");
      list.innerHTML = "";

      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;

      globalExercisePool.forEach(ex => {
        const isAdded = current.exerciseIds.includes(ex.id);
        const item = document.createElement("div");
        item.className = "flex items-center justify-between p-2 rounded-xl bg-zinc-950 border border-zinc-800 text-xs";
        item.innerHTML = `
          <div><p class="font-bold text-white">${ex.name}</p><p class="text-[10px] text-zinc-500">${ex.muscle}</p></div>
          <button onclick="toggleExerciseInRoutine('${ex.id}')" class="px-2.5 py-1 rounded text-xs font-semibold ${isAdded ? 'bg-rose-500/20 text-rose-400' : 'bg-blue-600 text-white'}">${isAdded ? 'Çıkar' : 'Ekle'}</button>
        `;
        list.appendChild(item);
      });
      modal.classList.remove("hidden");
    }

    function toggleExerciseInRoutine(exId) {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;
      if (current.exerciseIds.includes(exId)) {
        current.exerciseIds = current.exerciseIds.filter(id => id !== exId);
      } else {
        current.exerciseIds.push(exId);
      }
      saveRoutines();
      openExerciseSelector();
      renderApp();
    }

    function closeExerciseSelector() { document.getElementById("exercisePickerModal").classList.add("hidden"); }

    function updateAnalytics() {
      const current = routines.find(r => r.id === currentRoutineId);
      let muscleCounts = { gogus: 0, omuz: 0, sirt: 0, kol: 0 };

      if (current) {
        current.exerciseIds.forEach(exId => {
          const ex = globalExercisePool.find(e => e.id === exId);
          const sets = activeSets[exId] || [];
          sets.forEach(s => {
            if (s.done) {
              if (ex.tag === "gogus") muscleCounts.gogus++;
              if (ex.tag === "omuz") muscleCounts.omuz++;
              if (ex.tag === "sirt") muscleCounts.sirt++;
              if (ex.tag === "kol") muscleCounts.kol++;
            }
          });
        });
      }

      document.getElementById("cnt-gogus").innerText = muscleCounts.gogus;
      document.getElementById("cnt-omuz").innerText = muscleCounts.omuz;
      document.getElementById("cnt-sirt").innerText = muscleCounts.sirt;
      document.getElementById("cnt-kol").innerText = muscleCounts.kol;
    }

    function openDetailModal(exId) {
      const ex = globalExercisePool.find(e => e.id === exId);
      if (!ex) return;

      document.getElementById("modalExTitle").innerText = ex.name;
      document.getElementById("modalExMuscle").innerText = ex.muscle;

      const hist = getHistory(exId);
      const histContainer = document.getElementById("historyList");
      histContainer.innerHTML = "";

      if (hist.length === 0) {
        histContainer.innerHTML = `<p class="text-zinc-500 text-xs py-2 text-center">Henüz set kaydı yok.</p>`;
      } else {
        [...hist].reverse().forEach(h => {
          const row = document.createElement("div");
          row.className = "flex justify-between items-center bg-black p-2 rounded border border-zinc-800 text-[11px] font-mono";
          row.innerHTML = `<span class="text-zinc-500">${h.date}</span><span class="font-bold text-white">${h.kg} KG</span><span class="text-zinc-400">${h.reps} Rep</span><span class="${h.type === 'F' ? 'text-rose-400' : 'text-zinc-400'} font-bold">[${h.type}]</span>`;
          histContainer.appendChild(row);
        });
      }

      const ctx = document.getElementById('exerciseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = hist.map(h => h.date);
      const dataPoints = hist.map(h => {
        const nums = h.kg.match(/\d+(\.\d+)?/g);
        return nums ? nums.reduce((a, b) => parseFloat(a) + parseFloat(b), 0) : 0;
      });

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.slice(-8),
          datasets: [{ data: dataPoints.slice(-8), borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.1)', borderWidth: 2, tension: 0.3, fill: true }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717a', font: { size: 9 } } },
            y: { grid: { color: '#18181b' }, ticks: { color: '#71717a', font: { size: 9 } } }
          }
        }
      });

      document.getElementById("detailModal").classList.remove("hidden");
    }

    function closeDetailModal() { document.getElementById("detailModal").classList.add("hidden"); }

    renderApp();
  </script>
</body>
</html>
