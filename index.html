<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Antrenman Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen pb-32 font-sans select-none">

  <!-- Üst Bar & Rutin Seçici -->
  <header class="p-4 pt-6 border-b border-zinc-900 sticky top-0 bg-black/95 backdrop-blur-md z-40">
    <div class="flex justify-between items-center mb-3">
      <div class="flex items-center gap-2">
        <h1 id="currentRoutineName" class="text-xl font-bold tracking-tight text-white leading-tight">Upper Body</h1>
        <button onclick="createNewRoutine()" class="text-xs bg-zinc-800 text-zinc-300 hover:text-white px-2 py-1 rounded-lg border border-zinc-700">+ Rutin</button>
      </div>
      <span id="completedCounter" class="text-xs bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full font-semibold font-mono">0 Set Tamam</span>
    </div>

    <!-- Rutin Sekmeleri (Yatay Kaydırılabilir) -->
    <div id="routineTabs" class="flex gap-2 overflow-x-auto pb-1 text-xs font-semibold scrollbar-none"></div>
  </header>

  <!-- Kas Haritası & Dağılım Kartı -->
  <section class="max-w-lg mx-auto p-3">
    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 shadow-lg">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Hedef Kas Haritası</h2>
        <span class="text-[10px] text-zinc-500">Tamamlanan setler parlar</span>
      </div>

      <div class="grid grid-cols-2 gap-4 items-center bg-zinc-900/60 p-3 rounded-xl border border-zinc-800/80">
        <!-- Ön Vücut -->
        <div class="flex flex-col items-center">
          <span class="text-[10px] text-zinc-500 font-bold mb-1">ÖN GÖVDE</span>
          <svg class="w-24 h-36" viewBox="0 0 100 160" fill="none" stroke="#27272a" stroke-width="1.5">
            <circle cx="50" cy="18" r="10" stroke="#3f3f46" fill="#18181b"/>
            <path id="muscle-omuz-on" d="M30 35 Q50 30 70 35 L76 48 Q50 44 24 48 Z" fill="#27272a" class="transition-colors duration-300"/>
            <path id="muscle-gogus" d="M32 46 Q50 48 68 46 L66 65 Q50 68 34 65 Z" fill="#27272a" class="transition-colors duration-300"/>
            <path d="M36 67 Q50 69 64 67 L61 95 Q50 97 39 95 Z" fill="#18181b"/>
            <rect id="muscle-biceps" x="18" y="52" width="8" height="22" rx="4" fill="#27272a" class="transition-colors duration-300"/>
            <rect id="muscle-biceps-2" x="74" y="52" width="8" height="22" rx="4" fill="#27272a" class="transition-colors duration-300"/>
          </svg>
        </div>

        <!-- Arka Vücut -->
        <div class="flex flex-col items-center border-l border-zinc-800 pl-3">
          <span class="text-[10px] text-zinc-500 font-bold mb-1">ARKA GÖVDE</span>
          <svg class="w-24 h-36" viewBox="0 0 100 160" fill="none" stroke="#27272a" stroke-width="1.5">
            <circle cx="50" cy="18" r="10" stroke="#3f3f46" fill="#18181b"/>
            <path id="muscle-sirt" d="M32 35 Q50 40 68 35 L74 68 Q50 72 26 68 Z" fill="#27272a" class="transition-colors duration-300"/>
            <rect id="muscle-triceps" x="17" y="48" width="8" height="22" rx="4" fill="#27272a" class="transition-colors duration-300"/>
            <rect id="muscle-triceps-2" x="75" y="48" width="8" height="22" rx="4" fill="#27272a" class="transition-colors duration-300"/>
            <path d="M37 72 Q50 74 63 72 L60 95 Q50 97 40 95 Z" fill="#18181b"/>
          </svg>
        </div>
      </div>

      <!-- Sayaçlar -->
      <div class="grid grid-cols-4 gap-1.5 mt-3 text-center font-mono">
        <div class="bg-black/50 border border-zinc-800 p-1.5 rounded-lg">
          <span class="block text-[9px] text-zinc-500">GÖĞÜS</span>
          <span id="cnt-gogus" class="text-xs font-bold text-zinc-400">0 Set</span>
        </div>
        <div class="bg-black/50 border border-zinc-800 p-1.5 rounded-lg">
          <span class="block text-[9px] text-zinc-500">OMUZ</span>
          <span id="cnt-omuz" class="text-xs font-bold text-zinc-400">0 Set</span>
        </div>
        <div class="bg-black/50 border border-zinc-800 p-1.5 rounded-lg">
          <span class="block text-[9px] text-zinc-500">SIRT</span>
          <span id="cnt-sirt" class="text-xs font-bold text-zinc-400">0 Set</span>
        </div>
        <div class="bg-black/50 border border-zinc-800 p-1.5 rounded-lg">
          <span class="block text-[9px] text-zinc-500">KOL</span>
          <span id="cnt-kol" class="text-xs font-bold text-zinc-400">0 Set</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Egzersiz Listesi -->
  <main id="routineContainer" class="p-3 space-y-4 max-w-lg mx-auto"></main>

  <!-- Buton: Programa Egzersiz Ekle -->
  <div class="max-w-lg mx-auto px-3 mt-4">
    <button onclick="openExerciseSelector()" class="w-full py-3 rounded-2xl bg-zinc-900 border border-zinc-800 text-blue-400 font-bold text-xs flex items-center justify-center gap-2 hover:bg-zinc-850 active:scale-[0.99] transition shadow-md">
      <span>+</span> Bu Rutine Havuzdan Egzersiz Ekle
    </button>
  </div>

  <!-- Egzersiz Seçim Modalı -->
  <div id="exercisePickerModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-zinc-900 border border-zinc-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-base font-bold text-white">Egzersiz Havuzu</h2>
        <button onclick="closeExerciseSelector()" class="text-zinc-400 hover:text-white text-xl font-bold p-1">✕</button>
      </div>
      <p class="text-[11px] text-zinc-400 mb-3">Programa eklemek istediğin hareketleri seç:</p>
      
      <div id="pickerList" class="space-y-2 overflow-y-auto flex-1 pr-1"></div>
    </div>
  </div>

  <!-- Detay Modalı (Grafik, YouTube & Geçmiş) -->
  <div id="detailModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-zinc-900 border border-zinc-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h2 id="modalExTitle" class="text-lg font-bold text-white leading-tight"></h2>
          <span id="modalExMuscle" class="text-xs text-blue-400 font-medium"></span>
        </div>
        <button onclick="closeDetailModal()" class="text-zinc-400 hover:text-white text-xl font-bold p-1">✕</button>
      </div>

      <div id="videoContainer" class="mb-4">
        <a id="videoLink" href="#" target="_blank" class="flex items-center justify-between bg-zinc-800/80 border border-zinc-700 hover:border-blue-500 p-3 rounded-xl text-xs text-zinc-200 transition">
          <span class="flex items-center gap-2.5 font-medium">
            <span class="text-rose-500 text-base">▶</span> Form & Yapılış Rehberini İzle
          </span>
          <span class="text-[11px] text-zinc-400 font-mono bg-zinc-900 px-2 py-0.5 rounded border border-zinc-700" id="videoTimeBadge">00:00</span>
        </a>
      </div>

      <div class="bg-black border border-zinc-800 rounded-xl p-3 mb-4">
        <h4 class="text-[11px] font-semibold text-zinc-400 mb-2 tracking-wide">AĞIRLIK GELİŞİM GRAFİĞİ (KG)</h4>
        <canvas id="exerciseChart" height="170"></canvas>
      </div>

      <div>
        <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Tüm Antrenman Geçmişi</h3>
        <div id="historyList" class="space-y-1.5 max-h-48 overflow-y-auto text-xs"></div>
      </div>
    </div>
  </div>

  <script>
    // MERKEZİ EGZERSİZ HAVUZU (Tüm rutinler bu ortak havuzu kullanır)
    const globalExercisePool = [
      { id: "sp", name: "Shoulder Press", muscle: "Omuz (Ön/Yan)", tag: "omuz", videoUrl: "https://www.youtube.com/watch?v=qEwKCR5JCog&t=45s", time: "00:45" },
      { id: "clr", name: "Cable Lateral Raise", muscle: "Yan Omuz", tag: "omuz", videoUrl: "https://www.youtube.com/watch?v=PPrzBWZDOhA&t=30s", time: "00:30" },
      { id: "bp", name: "Bench Press", muscle: "Göğüs, Ön Omuz, Triceps", tag: "gogus", videoUrl: "https://www.youtube.com/watch?v=rT7DgCr-3pg&t=60s", time: "01:00" },
      { id: "cf", name: "Cable Fly", muscle: "İç / Orta Göğüs", tag: "gogus", videoUrl: "https://www.youtube.com/watch?v=Iwe6AmxVf7o&t=20s", time: "00:20" },
      { id: "scr", name: "Seated Cable Row", muscle: "Sırt, Lat, Rhomboid", tag: "sirt", videoUrl: "https://www.youtube.com/watch?v=GZbfZ033f74&t=15s", time: "00:15" },
      { id: "lp", name: "Lat Pulldown", muscle: "Üst Sırt, Kanat", tag: "sirt", videoUrl: "https://www.youtube.com/watch?v=CAwf7n6Luuc&t=40s", time: "00:40" },
      { id: "tb", name: "Triceps Bar Baş Üstü", muscle: "Arka Kol (Triceps)", tag: "triceps", videoUrl: "https://www.youtube.com/watch?v=b_Xhx2qS3oU&t=25s", time: "00:25" },
      { id: "btk", name: "Biceps Tek Kol", muscle: "Ön Kol (Biceps)", tag: "biceps", videoUrl: "https://www.youtube.com/watch?v=ykJmrZ5v0Oo&t=10s", time: "00:10" }
    ];

    // RUTİN LİSTESİ (Kullanıcı yeni rutin ekleyebilir, silebilir)
    let routines = JSON.parse(localStorage.getItem("fit_routines")) || [
      { id: "upper", name: "Upper Body", exerciseIds: ["sp", "clr", "bp", "cf", "scr", "lp", "tb", "btk"] },
      { id: "push", name: "Push (İtiş)", exerciseIds: ["bp", "cf", "sp", "clr", "tb"] }
    ];

    let currentRoutineId = localStorage.getItem("fit_current_routine") || routines[0].id;
    let chartInstance = null;

    function saveRoutines() {
      localStorage.setItem("fit_routines", JSON.stringify(routines));
    }

    function getHistory(exId) {
      return JSON.parse(localStorage.getItem(`fit_history_${exId}`) || "[]");
    }

    function saveHistory(exId, history) {
      localStorage.setItem(`fit_history_${exId}`, JSON.stringify(history));
    }

    let activeSets = JSON.parse(localStorage.getItem("fit_active_sets") || "{}");

    function saveActiveSets() {
      localStorage.setItem("fit_active_sets", JSON.stringify(activeSets));
      updateAnalytics();
    }

    function initActiveSetsForExercise(exId) {
      if (!activeSets[exId]) {
        const hist = getHistory(exId);
        const last = hist[hist.length - 1];
        activeSets[exId] = [
          { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "Norm", done: false },
          { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "F", done: false }
        ];
      }
    }

    // Rutin Sekmelerini Çiz
    function renderTabs() {
      const tabsContainer = document.getElementById("routineTabs");
      tabsContainer.innerHTML = "";

      routines.forEach(r => {
        const isActive = r.id === currentRoutineId;
        const btn = document.createElement("button");
        btn.className = `px-3.5 py-1.5 rounded-xl whitespace-nowrap transition border ${isActive ? 'bg-blue-600 border-blue-500 text-white shadow-md shadow-blue-600/30' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-white'}`;
        btn.innerText = r.name;
        btn.onclick = () => switchRoutine(r.id);
        tabsContainer.appendChild(btn);
      });

      const current = routines.find(r => r.id === currentRoutineId) || routines[0];
      document.getElementById("currentRoutineName").innerText = current.name;
    }

    function switchRoutine(id) {
      currentRoutineId = id;
      localStorage.setItem("fit_current_routine", id);
      renderTabs();
      renderApp();
    }

    function createNewRoutine() {
      const name = prompt("Yeni Rutin Adını Yazın (Örn: Bacak / Karın veya Full Body):");
      if (!name || !name.trim()) return;

      const newId = "routine_" + Date.now();
      routines.push({ id: newId, name: name.trim(), exerciseIds: [] });
      saveRoutines();
      switchRoutine(newId);
    }

    // Uygulama Ana Sayfasını Çiz
    function renderApp() {
      renderTabs();
      const current = routines.find(r => r.id === currentRoutineId) || routines[0];
      const container = document.getElementById("routineContainer");
      container.innerHTML = "";

      if (current.exerciseIds.length === 0) {
        container.innerHTML = `<div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6 text-center text-xs text-zinc-400">Bu rutinde henüz hareket yok. Alttaki butonla havuzdan egzersiz ekle!</div>`;
        updateAnalytics();
        return;
      }

      current.exerciseIds.forEach(exId => {
        const ex = globalExercisePool.find(e => e.id === exId);
        if (!ex) return;

        initActiveSetsForExercise(exId);
        const sets = activeSets[exId] || [];
        const hist = getHistory(exId);
        const lastRec = hist[hist.length - 1];

        const card = document.createElement("div");
        card.className = "bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4";

        let setsHtml = "";
        sets.forEach((set, idx) => {
          const isDone = set.done;
          setsHtml += `
            <div class="flex items-center gap-1.5 bg-black/60 p-2 rounded-xl border ${isDone ? 'border-blue-500/40 bg-blue-950/10' : 'border-zinc-800/80'}">
              <span class="w-6 text-xs font-bold ${isDone ? 'text-blue-400' : 'text-zinc-500'} font-mono">${idx + 1}</span>
              <input type="text" placeholder="${lastRec ? lastRec.kg : 'KG'}" value="${set.kg}" onchange="updateSetVal('${ex.id}', ${idx}, 'kg', this.value)" class="flex-1 bg-zinc-800/80 border border-zinc-700 rounded-lg p-1.5 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              <input type="text" placeholder="${lastRec ? lastRec.reps : 'Tekrar'}" value="${set.reps}" onchange="updateSetVal('${ex.id}', ${idx}, 'reps', this.value)" class="flex-1 bg-zinc-800/80 border border-zinc-700 rounded-lg p-1.5 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              
              <select onchange="updateSetVal('${ex.id}', ${idx}, 'type', this.value)" class="w-14 bg-zinc-800/80 border border-zinc-700 rounded-lg p-1.5 text-center text-[10px] font-bold ${set.type === 'F' ? 'text-rose-400' : set.type.includes('R') ? 'text-amber-400' : 'text-zinc-300'} focus:outline-none">
                <option value="Norm" ${set.type === 'Norm' ? 'selected' : ''}>Norm</option>
                <option value="F" ${set.type === 'F' ? 'selected' : ''}>F</option>
                <option value="R1" ${set.type === 'R1' ? 'selected' : ''}>R1</option>
                <option value="R2" ${set.type === 'R2' ? 'selected' : ''}>R2</option>
                <option value="W" ${set.type === 'W' ? 'selected' : ''}>W</option>
              </select>

              <button onclick="toggleSet('${ex.id}', ${idx})" class="w-8 h-8 rounded-lg font-bold flex items-center justify-center text-xs transition active:scale-90 ${isDone ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'bg-zinc-800 text-zinc-500'}">✓</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3 cursor-pointer" onclick="openDetailModal('${ex.id}')">
              <div class="w-9 h-9 rounded-full bg-blue-600/20 text-blue-400 font-bold flex items-center justify-center text-xs">
                ${ex.name.charAt(0)}
              </div>
              <div>
                <h3 class="text-blue-400 font-bold text-sm hover:underline">${ex.name}</h3>
                <p class="text-[11px] text-zinc-400">${ex.muscle}</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="removeExerciseFromRoutine('${ex.id}')" class="text-zinc-600 hover:text-rose-400 text-xs px-1">✕</button>
              <button onclick="openDetailModal('${ex.id}')" class="text-xs text-zinc-500 font-mono">Detay ›</button>
            </div>
          </div>

          <div class="space-y-2 mb-3">
            <div class="flex justify-between text-zinc-500 font-mono text-[10px] px-1">
              <span class="w-6">SET</span>
              <span class="flex-1 text-center">KG / DUMBBELL</span>
              <span class="flex-1 text-center">TEKRAR</span>
              <span class="w-14 text-center">TÜR</span>
              <span class="w-8 text-right">TİK</span>
            </div>
            ${setsHtml}
          </div>

          <div class="flex justify-between items-center pt-1 border-t border-zinc-800/60">
            <button onclick="addSet('${ex.id}')" class="text-xs font-semibold text-blue-400 hover:text-blue-300 py-1 px-2 rounded-lg bg-blue-600/10">+ Set Ekle</button>
            <button onclick="removeSet('${ex.id}')" class="text-[11px] text-zinc-500 hover:text-rose-400 py-1 px-2">Set Sil</button>
          </div>
        `;
        container.appendChild(card);
      });
      updateAnalytics();
    }

    function updateSetVal(exId, idx, field, val) {
      if (activeSets[exId] && activeSets[exId][idx]) {
        activeSets[exId][idx][field] = val;
        saveActiveSets();
      }
    }

    function addSet(exId) {
      const sets = activeSets[exId] || [];
      const prev = sets[sets.length - 1];
      sets.push({ kg: prev ? prev.kg : "", reps: prev ? prev.reps : "", type: "Norm", done: false });
      activeSets[exId] = sets;
      saveActiveSets();
      renderApp();
    }

    function removeSet(exId) {
      if (activeSets[exId] && activeSets[exId].length > 1) {
        activeSets[exId].pop();
        saveActiveSets();
        renderApp();
      }
    }

    function toggleSet(exId, idx) {
      const set = activeSets[exId][idx];
      if (!set.kg) {
        alert("Lütfen bir ağırlık gir!");
        return;
      }

      set.done = !set.done;
      saveActiveSets();

      if (set.done) {
        const hist = getHistory(exId);
        const date = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        hist.push({ date, kg: set.kg, reps: set.reps || "8", type: set.type });
        saveHistory(exId, hist);
      }
      renderApp();
    }

    // Havuzdan Rutine Egzersiz Ekleme/Çıkarma
    function removeExerciseFromRoutine(exId) {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;
      current.exerciseIds = current.exerciseIds.filter(id => id !== exId);
      saveRoutines();
      renderApp();
    }

    function openExerciseSelector() {
      const modal = document.getElementById("exercisePickerModal");
      const list = document.getElementById("pickerList");
      list.innerHTML = "";

      const current = routines.find(r => r.id === currentRoutineId);

      globalExercisePool.forEach(ex => {
        const isAdded = current.exerciseIds.includes(ex.id);
        const item = document.createElement("div");
        item.className = "flex items-center justify-between p-3 rounded-xl bg-black/60 border border-zinc-800";
        item.innerHTML = `
          <div>
            <p class="font-bold text-white text-xs">${ex.name}</p>
            <p class="text-[10px] text-zinc-400">${ex.muscle}</p>
          </div>
          <button onclick="toggleExerciseInRoutine('${ex.id}')" class="text-xs px-3 py-1 rounded-lg font-semibold ${isAdded ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-blue-600 text-white'}">
            ${isAdded ? 'Çıkar' : 'Ekle'}
          </button>
        `;
        list.appendChild(item);
      });

      modal.classList.remove("hidden");
    }

    function toggleExerciseInRoutine(exId) {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;

      if (current.exerciseIds.includes(exId)) {
        current.exerciseIds = current.exerciseIds.filter(id => id !== exId);
      } else {
        current.exerciseIds.push(exId);
      }
      saveRoutines();
      openExerciseSelector(); // Listeyi güncelle
      renderApp();
    }

    function closeExerciseSelector() {
      document.getElementById("exercisePickerModal").classList.add("hidden");
    }

    // Kas Analizi ve Harita
    function updateAnalytics() {
      const current = routines.find(r => r.id === currentRoutineId);
      let totalDone = 0;
      let muscleCounts = { gogus: 0, omuz: 0, sirt: 0, kol: 0 };

      if (current) {
        current.exerciseIds.forEach(exId => {
          const ex = globalExercisePool.find(e => e.id === exId);
          const sets = activeSets[exId] || [];
          sets.forEach(s => {
            if (s.done) {
              totalDone++;
              if (ex.tag === "gogus") muscleCounts.gogus++;
              if (ex.tag === "omuz") muscleCounts.omuz++;
              if (ex.tag === "sirt") muscleCounts.sirt++;
              if (ex.tag === "biceps" || ex.tag === "triceps") muscleCounts.kol++;
            }
          });
        });
      }

      document.getElementById("completedCounter").innerText = `${totalDone} Set Tamam`;
      document.getElementById("cnt-gogus").innerText = `${muscleCounts.gogus} Set`;
      document.getElementById("cnt-omuz").innerText = `${muscleCounts.omuz} Set`;
      document.getElementById("cnt-sirt").innerText = `${muscleCounts.sirt} Set`;
      document.getElementById("cnt-kol").innerText = `${muscleCounts.kol} Set`;

      const highlightColor = "#2563eb";
      const defaultColor = "#27272a";

      document.getElementById("muscle-gogus").setAttribute("fill", muscleCounts.gogus > 0 ? highlightColor : defaultColor);
      document.getElementById("muscle-omuz-on").setAttribute("fill", muscleCounts.omuz > 0 ? highlightColor : defaultColor);
      document.getElementById("muscle-sirt").setAttribute("fill", muscleCounts.sirt > 0 ? highlightColor : defaultColor);

      const bicepsActive = (activeSets["btk"] || []).some(s => s.done);
      document.getElementById("muscle-biceps").setAttribute("fill", bicepsActive ? highlightColor : defaultColor);
      document.getElementById("muscle-biceps-2").setAttribute("fill", bicepsActive ? highlightColor : defaultColor);

      const tricepsActive = (activeSets["tb"] || []).some(s => s.done);
      document.getElementById("muscle-triceps").setAttribute("fill", tricepsActive ? highlightColor : defaultColor);
      document.getElementById("muscle-triceps-2").setAttribute("fill", tricepsActive ? highlightColor : defaultColor);
    }

    // Modal Fonksiyonları
    function openDetailModal(exId) {
      const ex = globalExercisePool.find(e => e.id === exId);
      if (!ex) return;

      document.getElementById("modalExTitle").innerText = ex.name;
      document.getElementById("modalExMuscle").innerText = ex.muscle;

      const linkEl = document.getElementById("videoLink");
      const timeBadge = document.getElementById("videoTimeBadge");
      linkEl.href = ex.videoUrl;
      timeBadge.innerText = ex.time || "İzle";

      const hist = getHistory(exId);
      const histContainer = document.getElementById("historyList");
      histContainer.innerHTML = "";

      if (hist.length === 0) {
        histContainer.innerHTML = `<p class="text-zinc-500 text-xs py-2 text-center">Henüz tamamlanan set geçmişi yok.</p>`;
      } else {
        [...hist].reverse().forEach(h => {
          const row = document.createElement("div");
          row.className = "flex justify-between items-center bg-black/60 p-2 rounded-lg border border-zinc-800 text-xs font-mono";
          row.innerHTML = `
            <span class="text-zinc-400">${h.date}</span>
            <span class="font-bold text-white">${h.kg} KG</span>
            <span class="text-zinc-400">${h.reps} Tekrar</span>
            <span class="${h.type === 'F' ? 'text-rose-400' : 'text-amber-400'} font-bold">[${h.type}]</span>
          `;
          histContainer.appendChild(row);
        });
      }

      const ctx = document.getElementById('exerciseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = hist.map(h => h.date);
      const dataPoints = hist.map(h => {
        const nums = h.kg.match(/\d+(\.\d+)?/g);
        if (!nums) return 0;
        return nums.reduce((a, b) => parseFloat(a) + parseFloat(b), 0);
      });

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.slice(-10),
          datasets: [{
            data: dataPoints.slice(-10),
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.12)',
            borderWidth: 2,
            tension: 0.35,
            fill: true,
            pointBackgroundColor: '#2563eb'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717a', font: { size: 10 } } },
            y: { grid: { color: '#18181b' }, ticks: { color: '#71717a', font: { size: 10 } } }
          }
        }
      });

      document.getElementById("detailModal").classList.remove("hidden");
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.add("hidden");
    }

    renderApp();
  </script>
</body>
</html>
