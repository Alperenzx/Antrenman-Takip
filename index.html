<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Antrenman Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* iOS Safari yatay taşma ve kayma kilidi */
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      background-color: #000000;
      -webkit-tap-highlight-color: transparent;
    }
    input, select, button {
      font-size: 13px !important; /* iOS input yakınlaşmasını engeller */
    }
  </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen pb-32 font-sans select-none antialiased">

  <!-- Üst Bar & Rutin Başlığı -->
  <header class="p-3 pt-5 border-b border-zinc-900 sticky top-0 bg-black/95 backdrop-blur-md z-40">
    <div class="flex justify-between items-center mb-2">
      <div class="flex items-center gap-2">
        <h1 id="currentRoutineName" class="text-lg font-bold text-white tracking-tight">Upper Body</h1>
        <button onclick="createNewRoutine()" class="text-[11px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded border border-zinc-700 active:scale-95">+ Rutin</button>
      </div>
      <span id="completedCounter" class="text-[11px] bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2.5 py-0.5 rounded-full font-mono font-semibold">0 Set</span>
    </div>

    <!-- Rutin Sekmeleri -->
    <div id="routineTabs" class="flex gap-1.5 overflow-x-auto pb-1 text-xs font-medium no-scrollbar"></div>
  </header>

  <div class="w-full max-w-md mx-auto px-3">

    <!-- Kas Haritası Bölümü -->
    <section class="mt-3 bg-zinc-950 border border-zinc-800/80 rounded-2xl p-3 shadow-md">
      <div class="flex justify-between items-center mb-2">
        <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">ÇALIŞAN KAS HARİTASI</span>
        <span class="text-[9px] text-zinc-500">Tiklendikçe parlar</span>
      </div>

      <!-- Vücut Silüetleri -->
      <div class="flex justify-around items-center bg-zinc-900/50 p-2 rounded-xl border border-zinc-800/60 mb-2.5">
        <!-- Ön Gövde -->
        <div class="flex flex-col items-center">
          <span class="text-[9px] text-zinc-500 font-bold mb-1">ÖN</span>
          <svg class="w-20 h-32" viewBox="0 0 100 160">
            <circle cx="50" cy="18" r="10" stroke="#3f3f46" stroke-width="1.5" fill="#18181b"/>
            <!-- Omuz -->
            <path id="muscle-omuz-on" d="M28 36 Q50 30 72 36 L78 48 Q50 44 22 48 Z" fill="#27272a"/>
            <!-- Göğüs -->
            <path id="muscle-gogus" d="M30 47 Q50 49 70 47 L68 66 Q50 69 32 66 Z" fill="#27272a"/>
            <!-- Karın -->
            <path d="M35 68 Q50 70 65 68 L62 96 Q50 98 38 96 Z" fill="#18181b"/>
            <!-- Kollar (Biceps) -->
            <rect id="muscle-biceps" x="16" y="52" width="7" height="20" rx="3" fill="#27272a"/>
            <rect id="muscle-biceps-2" x="77" y="52" width="7" height="20" rx="3" fill="#27272a"/>
          </svg>
        </div>

        <!-- Arka Gövde -->
        <div class="flex flex-col items-center border-l border-zinc-800 pl-4">
          <span class="text-[9px] text-zinc-500 font-bold mb-1">ARKA</span>
          <svg class="w-20 h-32" viewBox="0 0 100 160">
            <circle cx="50" cy="18" r="10" stroke="#3f3f46" stroke-width="1.5" fill="#18181b"/>
            <!-- Sırt -->
            <path id="muscle-sirt" d="M30 36 Q50 41 70 36 L76 70 Q50 74 24 70 Z" fill="#27272a"/>
            <!-- Triceps -->
            <rect id="muscle-triceps" x="15" y="48" width="7" height="20" rx="3" fill="#27272a"/>
            <rect id="muscle-triceps-2" x="78" y="48" width="7" height="20" rx="3" fill="#27272a"/>
            <path d="M36 72 Q50 74 64 72 L61 96 Q50 98 39 96 Z" fill="#18181b"/>
          </svg>
        </div>
      </div>

      <!-- Sayaçlar -->
      <div class="grid grid-cols-4 gap-1 text-center font-mono">
        <div class="bg-black/60 border border-zinc-800/80 p-1 rounded-lg">
          <span class="block text-[8px] text-zinc-500">GÖĞÜS</span>
          <span id="cnt-gogus" class="text-[11px] font-bold text-zinc-300">0</span>
        </div>
        <div class="bg-black/60 border border-zinc-800/80 p-1 rounded-lg">
          <span class="block text-[8px] text-zinc-500">OMUZ</span>
          <span id="cnt-omuz" class="text-[11px] font-bold text-zinc-300">0</span>
        </div>
        <div class="bg-black/60 border border-zinc-800/80 p-1 rounded-lg">
          <span class="block text-[8px] text-zinc-500">SIRT</span>
          <span id="cnt-sirt" class="text-[11px] font-bold text-zinc-300">0</span>
        </div>
        <div class="bg-black/60 border border-zinc-800/80 p-1 rounded-lg">
          <span class="block text-[8px] text-zinc-500">KOL</span>
          <span id="cnt-kol" class="text-[11px] font-bold text-zinc-300">0</span>
        </div>
      </div>
    </section>

    <!-- Hareket Listesi -->
    <main id="routineContainer" class="mt-3 space-y-3"></main>

    <!-- Havuzdan Ekle Butonu -->
    <button onclick="openExerciseSelector()" class="w-full mt-3 py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-blue-400 font-semibold text-xs flex items-center justify-center gap-1 active:bg-zinc-800">
      <span class="text-sm font-bold">+</span> Bu Rutine Egzersiz Ekle
    </button>
  </div>

  <!-- Detay Modalı (Grafik & Geçmiş) -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end justify-center p-0">
    <div class="bg-zinc-900 border-t border-zinc-800 w-full rounded-t-3xl p-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h2 id="modalExTitle" class="text-base font-bold text-white leading-tight"></h2>
          <span id="modalExMuscle" class="text-[11px] text-blue-400 font-medium"></span>
        </div>
        <button onclick="closeDetailModal()" class="text-zinc-400 text-lg font-bold px-2 py-1">✕</button>
      </div>

      <div class="bg-black border border-zinc-800 rounded-xl p-2.5 mb-3">
        <h4 class="text-[10px] font-semibold text-zinc-400 mb-1">AĞIRLIK İLERLEMESİ (KG)</h4>
        <canvas id="exerciseChart" height="150"></canvas>
      </div>

      <div>
        <h3 class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Tüm Geçmiş</h3>
        <div id="historyList" class="space-y-1.5 max-h-40 overflow-y-auto text-xs"></div>
      </div>
    </div>
  </div>

  <!-- Egzersiz Havuz Seçim Modalı -->
  <div id="exercisePickerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end justify-center p-0">
    <div class="bg-zinc-900 border-t border-zinc-800 w-full rounded-t-3xl p-4 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm font-bold text-white">Egzersiz Havuzu</h2>
        <button onclick="closeExerciseSelector()" class="text-zinc-400 text-lg font-bold px-2 py-1">✕</button>
      </div>
      <div id="pickerList" class="space-y-2 overflow-y-auto flex-1 py-1"></div>
    </div>
  </div>

  <script>
    const globalExercisePool = [
      { id: "sp", name: "Shoulder Press", muscle: "Omuz (Ön/Yan)", tag: "omuz" },
      { id: "clr", name: "Cable Lateral Raise", muscle: "Yan Omuz", tag: "omuz" },
      { id: "bp", name: "Bench Press", muscle: "Göğüs, Ön Omuz", tag: "gogus" },
      { id: "cf", name: "Cable Fly", muscle: "İç Göğüs", tag: "gogus" },
      { id: "scr", name: "Seated Cable Row", muscle: "Sırt, Kanat", tag: "sirt" },
      { id: "lp", name: "Lat Pulldown", muscle: "Üst Sırt", tag: "sirt" },
      { id: "tb", name: "Triceps Bar Baş Üstü", muscle: "Arka Kol", tag: "triceps" },
      { id: "btk", name: "Biceps Tek Kol", muscle: "Ön Kol", tag: "biceps" }
    ];

    let routines = JSON.parse(localStorage.getItem("fit_routines")) || [
      { id: "upper", name: "Upper Body", exerciseIds: ["sp", "clr", "bp", "cf", "scr", "lp", "tb", "btk"] },
      { id: "push", name: "Push (İtiş)", exerciseIds: ["bp", "cf", "sp", "clr", "tb"] }
    ];

    let currentRoutineId = localStorage.getItem("fit_current_routine") || routines[0].id;
    let chartInstance = null;

    function saveRoutines() {
      localStorage.setItem("fit_routines", JSON.stringify(routines));
    }

    function getHistory(exId) {
      return JSON.parse(localStorage.getItem(`fit_history_${exId}`) || "[]");
    }

    function saveHistory(exId, history) {
      localStorage.setItem(`fit_history_${exId}`, JSON.stringify(history));
    }

    let activeSets = JSON.parse(localStorage.getItem("fit_active_sets") || "{}");

    function saveActiveSets() {
      localStorage.setItem("fit_active_sets", JSON.stringify(activeSets));
      updateAnalytics();
    }

    function initActiveSetsForExercise(exId) {
      if (!activeSets[exId]) {
        const hist = getHistory(exId);
        const last = hist[hist.length - 1];
        activeSets[exId] = [
          { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "Norm", done: false },
          { kg: last ? last.kg : "", reps: last ? last.reps : "", type: "F", done: false }
        ];
      }
    }

    function renderTabs() {
      const container = document.getElementById("routineTabs");
      container.innerHTML = "";

      routines.forEach(r => {
        const isActive = r.id === currentRoutineId;
        const btn = document.createElement("button");
        btn.className = `px-3 py-1 rounded-lg text-xs font-semibold whitespace-nowrap transition ${isActive ? 'bg-blue-600 text-white shadow-sm' : 'bg-zinc-900 border border-zinc-800 text-zinc-400'}`;
        btn.innerText = r.name;
        btn.onclick = () => switchRoutine(r.id);
        container.appendChild(btn);
      });

      const current = routines.find(r => r.id === currentRoutineId) || routines[0];
      document.getElementById("currentRoutineName").innerText = current.name;
    }

    function switchRoutine(id) {
      currentRoutineId = id;
      localStorage.setItem("fit_current_routine", id);
      renderTabs();
      renderApp();
    }

    function createNewRoutine() {
      const name = prompt("Yeni Rutin Adı:");
      if (!name || !name.trim()) return;
      const newId = "r_" + Date.now();
      routines.push({ id: newId, name: name.trim(), exerciseIds: [] });
      saveRoutines();
      switchRoutine(newId);
    }

    function renderApp() {
      renderTabs();
      const current = routines.find(r => r.id === currentRoutineId) || routines[0];
      const container = document.getElementById("routineContainer");
      container.innerHTML = "";

      if (current.exerciseIds.length === 0) {
        container.innerHTML = `<div class="bg-zinc-900/40 border border-zinc-800 rounded-xl p-5 text-center text-xs text-zinc-500">Bu rutinde hareket yok. Alttan ekle.</div>`;
        updateAnalytics();
        return;
      }

      current.exerciseIds.forEach(exId => {
        const ex = globalExercisePool.find(e => e.id === exId);
        if (!ex) return;

        initActiveSetsForExercise(exId);
        const sets = activeSets[exId] || [];
        const hist = getHistory(exId);
        const lastRec = hist[hist.length - 1];

        const card = document.createElement("div");
        card.className = "bg-zinc-950 border border-zinc-800/80 rounded-2xl p-3";

        let setsHtml = "";
        sets.forEach((set, idx) => {
          const isDone = set.done;
          setsHtml += `
            <div class="grid grid-cols-[20px_1fr_1fr_48px_32px] gap-1.5 items-center bg-zinc-900/60 p-1.5 rounded-lg border ${isDone ? 'border-blue-500/50 bg-blue-950/20' : 'border-zinc-800/60'}">
              <span class="text-[11px] font-bold ${isDone ? 'text-blue-400' : 'text-zinc-500'} text-center font-mono">${idx + 1}</span>
              
              <input type="text" placeholder="${lastRec ? lastRec.kg : 'KG'}" value="${set.kg}" onchange="updateSetVal('${ex.id}', ${idx}, 'kg', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              
              <input type="text" placeholder="${lastRec ? lastRec.reps : 'Tekrar'}" value="${set.reps}" onchange="updateSetVal('${ex.id}', ${idx}, 'reps', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-center text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
              
              <select onchange="updateSetVal('${ex.id}', ${idx}, 'type', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-center text-[10px] font-bold ${set.type === 'F' ? 'text-rose-400' : 'text-zinc-300'} focus:outline-none">
                <option value="Norm" ${set.type === 'Norm' ? 'selected' : ''}>OK</option>
                <option value="F" ${set.type === 'F' ? 'selected' : ''}>F</option>
                <option value="R1" ${set.type === 'R1' ? 'selected' : ''}>R1</option>
                <option value="R2" ${set.type === 'R2' ? 'selected' : ''}>R2</option>
              </select>

              <button onclick="toggleSet('${ex.id}', ${idx})" class="w-8 h-7 rounded font-bold flex items-center justify-center text-xs transition active:scale-95 ${isDone ? 'bg-blue-600 text-white' : 'bg-zinc-800 text-zinc-500'}">✓</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <div class="cursor-pointer" onclick="openDetailModal('${ex.id}')">
              <h3 class="text-blue-400 font-bold text-xs hover:underline">${ex.name}</h3>
              <p class="text-[10px] text-zinc-500">${ex.muscle}</p>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="openDetailModal('${ex.id}')" class="text-[10px] text-zinc-400 bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded">Grafik</button>
              <button onclick="removeExerciseFromRoutine('${ex.id}')" class="text-zinc-600 hover:text-rose-400 text-xs px-1">✕</button>
            </div>
          </div>

          <div class="space-y-1 mb-2">
            <div class="grid grid-cols-[20px_1fr_1fr_48px_32px] gap-1.5 text-zinc-500 font-mono text-[9px] px-1 text-center">
              <span>S</span><span>KG</span><span>REP</span><span>TÜR</span><span>TİK</span>
            </div>
            ${setsHtml}
          </div>

          <div class="flex justify-between items-center pt-1 border-t border-zinc-900">
            <button onclick="addSet('${ex.id}')" class="text-[11px] font-semibold text-blue-400 py-0.5 px-1.5">+ Set</button>
            <button onclick="removeSet('${ex.id}')" class="text-[10px] text-zinc-500 hover:text-rose-400 py-0.5 px-1.5">- Sil</button>
          </div>
        `;
        container.appendChild(card);
      });
      updateAnalytics();
    }

    function updateSetVal(exId, idx, field, val) {
      if (activeSets[exId] && activeSets[exId][idx]) {
        activeSets[exId][idx][field] = val;
        saveActiveSets();
      }
    }

    function addSet(exId) {
      const sets = activeSets[exId] || [];
      const prev = sets[sets.length - 1];
      sets.push({ kg: prev ? prev.kg : "", reps: prev ? prev.reps : "", type: "Norm", done: false });
      activeSets[exId] = sets;
      saveActiveSets();
      renderApp();
    }

    function removeSet(exId) {
      if (activeSets[exId] && activeSets[exId].length > 1) {
        activeSets[exId].pop();
        saveActiveSets();
        renderApp();
      }
    }

    function toggleSet(exId, idx) {
      const set = activeSets[exId][idx];
      if (!set.kg) {
        alert("Ağırlık yazmalısın!");
        return;
      }

      set.done = !set.done;
      saveActiveSets();

      if (set.done) {
        const hist = getHistory(exId);
        const date = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        hist.push({ date, kg: set.kg, reps: set.reps || "8", type: set.type });
        saveHistory(exId, hist);
      }
      renderApp();
    }

    function removeExerciseFromRoutine(exId) {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;
      current.exerciseIds = current.exerciseIds.filter(id => id !== exId);
      saveRoutines();
      renderApp();
    }

    function openExerciseSelector() {
      const modal = document.getElementById("exercisePickerModal");
      const list = document.getElementById("pickerList");
      list.innerHTML = "";

      const current = routines.find(r => r.id === currentRoutineId);

      globalExercisePool.forEach(ex => {
        const isAdded = current.exerciseIds.includes(ex.id);
        const item = document.createElement("div");
        item.className = "flex items-center justify-between p-2 rounded-xl bg-zinc-950 border border-zinc-800 text-xs";
        item.innerHTML = `
          <div>
            <p class="font-bold text-white">${ex.name}</p>
            <p class="text-[10px] text-zinc-500">${ex.muscle}</p>
          </div>
          <button onclick="toggleExerciseInRoutine('${ex.id}')" class="px-2.5 py-1 rounded text-xs font-semibold ${isAdded ? 'bg-rose-500/20 text-rose-400' : 'bg-blue-600 text-white'}">
            ${isAdded ? 'Çıkar' : 'Ekle'}
          </button>
        `;
        list.appendChild(item);
      });

      modal.classList.remove("hidden");
    }

    function toggleExerciseInRoutine(exId) {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;

      if (current.exerciseIds.includes(exId)) {
        current.exerciseIds = current.exerciseIds.filter(id => id !== exId);
      } else {
        current.exerciseIds.push(exId);
      }
      saveRoutines();
      openExerciseSelector();
      renderApp();
    }

    function closeExerciseSelector() {
      document.getElementById("exercisePickerModal").classList.add("hidden");
    }

    function updateAnalytics() {
      const current = routines.find(r => r.id === currentRoutineId);
      let totalDone = 0;
      let muscleCounts = { gogus: 0, omuz: 0, sirt: 0, kol: 0 };

      if (current) {
        current.exerciseIds.forEach(exId => {
          const ex = globalExercisePool.find(e => e.id === exId);
          const sets = activeSets[exId] || [];
          sets.forEach(s => {
            if (s.done) {
              totalDone++;
              if (ex.tag === "gogus") muscleCounts.gogus++;
              if (ex.tag === "omuz") muscleCounts.omuz++;
              if (ex.tag === "sirt") muscleCounts.sirt++;
              if (ex.tag === "biceps" || ex.tag === "triceps") muscleCounts.kol++;
            }
          });
        });
      }

      document.getElementById("completedCounter").innerText = `${totalDone} Set`;
      document.getElementById("cnt-gogus").innerText = muscleCounts.gogus;
      document.getElementById("cnt-omuz").innerText = muscleCounts.omuz;
      document.getElementById("cnt-sirt").innerText = muscleCounts.sirt;
      document.getElementById("cnt-kol").innerText = muscleCounts.kol;

      const hl = "#2563eb";
      const def = "#27272a";

      document.getElementById("muscle-gogus").setAttribute("fill", muscleCounts.gogus > 0 ? hl : def);
      document.getElementById("muscle-omuz-on").setAttribute("fill", muscleCounts.omuz > 0 ? hl : def);
      document.getElementById("muscle-sirt").setAttribute("fill", muscleCounts.sirt > 0 ? hl : def);

      const bicepsActive = (activeSets["btk"] || []).some(s => s.done);
      document.getElementById("muscle-biceps").setAttribute("fill", bicepsActive ? hl : def);
      document.getElementById("muscle-biceps-2").setAttribute("fill", bicepsActive ? hl : def);

      const tricepsActive = (activeSets["tb"] || []).some(s => s.done);
      document.getElementById("muscle-triceps").setAttribute("fill", tricepsActive ? hl : def);
      document.getElementById("muscle-triceps-2").setAttribute("fill", tricepsActive ? hl : def);
    }

    function openDetailModal(exId) {
      const ex = globalExercisePool.find(e => e.id === exId);
      if (!ex) return;

      document.getElementById("modalExTitle").innerText = ex.name;
      document.getElementById("modalExMuscle").innerText = ex.muscle;

      const hist = getHistory(exId);
      const histContainer = document.getElementById("historyList");
      histContainer.innerHTML = "";

      if (hist.length === 0) {
        histContainer.innerHTML = `<p class="text-zinc-500 text-xs py-2 text-center">Henüz tamamlanan set kaydı yok.</p>`;
      } else {
        [...hist].reverse().forEach(h => {
          const row = document.createElement("div");
          row.className = "flex justify-between items-center bg-black p-2 rounded border border-zinc-800 text-[11px] font-mono";
          row.innerHTML = `
            <span class="text-zinc-500">${h.date}</span>
            <span class="font-bold text-white">${h.kg} KG</span>
            <span class="text-zinc-400">${h.reps} Rep</span>
            <span class="${h.type === 'F' ? 'text-rose-400' : 'text-zinc-400'} font-bold">[${h.type}]</span>
          `;
          histContainer.appendChild(row);
        });
      }

      const ctx = document.getElementById('exerciseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = hist.map(h => h.date);
      const dataPoints = hist.map(h => {
        const nums = h.kg.match(/\d+(\.\d+)?/g);
        if (!nums) return 0;
        return nums.reduce((a, b) => parseFloat(a) + parseFloat(b), 0);
      });

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.slice(-8),
          datasets: [{
            data: dataPoints.slice(-8),
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            borderWidth: 2,
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717a', font: { size: 9 } } },
            y: { grid: { color: '#18181b' }, ticks: { color: '#71717a', font: { size: 9 } } }
          }
        }
      });

      document.getElementById("detailModal").classList.remove("hidden");
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.add("hidden");
    }

    renderApp();
  </script>
</body>
</html>
