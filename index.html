<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Antrenman Takip</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --sat: env(safe-area-inset-top, 44px);
    }
    body {
      padding-top: var(--sat);
      background-color: #000000;
      color: #f4f4f5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      letter-spacing: -0.015em;
    }
    .font-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    body.modal-open {
      overflow: hidden !important;
      touch-action: none;
    }

    /* Animasyonlar */
    @keyframes pageSlideIn {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pageSlideBack {
      from { opacity: 0; transform: translateX(-24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes cardFadeInUp {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalCenterPop {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .anim-forward { animation: pageSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-back { animation: pageSlideBack 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-card { animation: cardFadeInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-pop { animation: modalCenterPop 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-sheet { animation: sheetSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-fade { animation: fadeIn 0.2s ease-out forwards; }

    .tap-press {
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .tap-press:active {
      transform: scale(0.95);
      opacity: 0.85;
    }
  </style>
</head>
<body class="min-h-screen pb-24 antialiased">

  <!-- ================= SAYFA 1: ANA SAYFA ================= -->
  <div id="viewHome" class="px-4 max-w-md mx-auto">
    <header class="py-5 border-b border-zinc-900/60 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-white">Programlar</h1>
        <p class="text-xs text-zinc-500 font-medium mt-0.5">Antrenmana başlamak için seç</p>
      </div>
      <button onclick="openNewRoutineModal()" class="tap-press bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2.5 rounded-2xl shadow-lg shadow-blue-600/20 flex items-center gap-1">
        <span class="text-sm font-extrabold">+</span> Yeni Program
      </button>
    </header>

    <div id="routineCardList" class="mt-4 space-y-3"></div>
  </div>


  <!-- ================= SAYFA 2: AKTİF ANTRENMAN EKRANI ================= -->
  <div id="viewWorkout" class="hidden px-3 max-w-md mx-auto">
    <header class="py-3 border-b border-zinc-900/60 flex justify-between items-center sticky top-0 bg-black/95 backdrop-blur-md z-30">
      <div class="flex items-center gap-2.5">
        <button onclick="goHome()" class="tap-press w-9 h-9 rounded-2xl bg-zinc-900/80 border border-zinc-800/60 flex items-center justify-center text-sm font-bold text-zinc-300">
          ←
        </button>
        <div>
          <h2 id="workoutTitle" class="text-base font-extrabold text-white leading-tight"></h2>
          <span id="workoutSubtitle" class="text-[11px] text-zinc-500 font-num">0 Egzersiz</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="completedCounter" class="text-[11px] bg-blue-600/15 text-blue-400 border border-blue-500/20 px-3 py-1 rounded-full font-num font-bold">0 Set</span>
        <button onclick="deleteCurrentRoutine()" class="tap-press w-9 h-9 rounded-2xl bg-zinc-900/80 border border-zinc-800/60 text-zinc-500 hover:text-rose-400 flex items-center justify-center text-xs">
          🗑️
        </button>
      </div>
    </header>

    <main id="routineContainer" class="mt-3.5 space-y-3"></main>

    <div class="mt-4">
      <button onclick="openExerciseSelector()" class="tap-press w-full py-4 rounded-2xl bg-zinc-950 border border-zinc-900 text-blue-400 font-extrabold text-xs flex items-center justify-center gap-2 shadow-md">
        <span class="text-base font-bold">+</span> Egzersiz Ekle
      </button>
    </div>
  </div>


  <!-- ================= SAYFA 3: HAREKETE ÖZEL DETAY SAYFASI (YEPYENİ SAYFA) ================= -->
  <div id="viewExerciseDetail" class="hidden px-4 max-w-md mx-auto">
    <header class="py-3 border-b border-zinc-900/60 flex justify-between items-center sticky top-0 bg-black/95 backdrop-blur-md z-30">
      <button onclick="closeExerciseDetail()" class="tap-press w-9 h-9 rounded-2xl bg-zinc-900/80 border border-zinc-800/60 flex items-center justify-center text-sm font-bold text-zinc-300">
        ←
      </button>
      <div class="text-center flex-1 px-2">
        <h2 id="detailExPageTitle" class="text-base font-extrabold text-white leading-tight truncate"></h2>
        <span id="detailExPageMuscle" class="text-[10px] text-blue-400 font-semibold uppercase tracking-wider"></span>
      </div>
      <div class="w-9"></div>
    </header>

    <!-- Kademeli Ağırlık Artış Çizelgesi -->
    <section class="mt-4 bg-zinc-950 border border-zinc-900 rounded-3xl p-4 shadow-lg">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xs font-bold text-zinc-400 font-num tracking-wide">AĞIRLIK ARTIŞ GELİŞİMİ</h3>
        <span class="text-[10px] text-zinc-500 font-num">Son Antrenmanlar</span>
      </div>
      <div class="h-44 w-full">
        <canvas id="detailProgressionChart"></canvas>
      </div>
    </section>

    <!-- Özel Not / Ayar Ekleme Alanı -->
    <section class="mt-3.5 bg-zinc-950 border border-zinc-900 rounded-3xl p-4 shadow-lg">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-xs font-bold text-zinc-400 tracking-wide">HAREKET NOTLARI & AYARLAR</h3>
        <button onclick="saveExerciseNote()" class="tap-press text-[11px] text-blue-400 font-bold bg-blue-600/10 px-2.5 py-1 rounded-lg">Kaydet</button>
      </div>
      <textarea id="detailExNoteInput" placeholder="Örn: Sehpa açısı 2. kademede, tutuş genişliği omuz hizasında..." class="w-full h-20 bg-black/80 border border-zinc-850 rounded-2xl p-3 text-xs text-zinc-200 focus:outline-none focus:border-blue-500/50 resize-none font-medium leading-relaxed"></textarea>
    </section>

    <!-- Geçmiş Kayıtlar Tablosu -->
    <section class="mt-3.5 mb-8">
      <h3 class="text-xs font-bold text-zinc-500 mb-2 px-1 font-num uppercase tracking-wider">Antrenman Geçmişi</h3>
      <div id="detailExHistoryList" class="space-y-2"></div>
    </section>
  </div>


  <!-- ================= POPUP 1: YENİ PROGRAM ADI ================= -->
  <div id="newRoutineModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 anim-fade" onclick="closeNewRoutineModal(event)">
    <div class="bg-zinc-950 border border-zinc-850 w-full max-w-sm rounded-[28px] p-6 shadow-2xl anim-pop" onclick="event.stopPropagation()">
      <div class="w-12 h-12 rounded-2xl bg-blue-600/10 text-blue-400 flex items-center justify-center font-bold text-xl mx-auto mb-3">
        📋
      </div>
      <h3 class="text-center text-lg font-black text-white mb-1 tracking-tight">Yeni Program</h3>
      <p class="text-center text-xs text-zinc-500 mb-5 font-medium">Programına bir isim ver.</p>

      <input id="newRoutineInput" type="text" placeholder="Örn: Upper Body, Push, Bacak" class="w-full bg-black border border-zinc-800 focus:border-blue-500/60 rounded-2xl p-3.5 text-center text-sm text-white focus:outline-none mb-5 transition font-semibold">

      <div class="flex gap-2.5">
        <button onclick="closeNewRoutineModal()" class="tap-press flex-1 py-3.5 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-400 font-bold text-xs">Vazgeç</button>
        <button onclick="submitNewRoutine()" class="tap-press flex-1 py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg shadow-blue-600/25">Oluştur</button>
      </div>
    </div>
  </div>


  <!-- ================= POPUP 2: YENİ HAREKET TANIMLA ================= -->
  <div id="newExerciseModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 anim-fade" onclick="closeNewExerciseModal(event)">
    <div class="bg-zinc-950 border border-zinc-850 w-full max-w-sm rounded-[28px] p-6 shadow-2xl anim-pop" onclick="event.stopPropagation()">
      <div class="w-12 h-12 rounded-2xl bg-blue-600/10 text-blue-400 flex items-center justify-center font-bold text-xl mx-auto mb-3">
        💪
      </div>
      <h3 class="text-center text-lg font-black text-white mb-1 tracking-tight">Yeni Egzersiz</h3>
      <p class="text-center text-xs text-zinc-500 mb-4 font-medium">Hareket adını ve kas grubunu belirle.</p>

      <input id="newExNameInput" type="text" placeholder="Hareket Adı (Örn: Incline DB Press)" class="w-full bg-black border border-zinc-800 focus:border-blue-500/60 rounded-2xl p-3.5 text-center text-xs text-white focus:outline-none mb-2.5 transition font-semibold">

      <input id="newExMuscleInput" type="text" placeholder="Bölge (Göğüs, Omuz, Sırt, Kol)" class="w-full bg-black border border-zinc-800 focus:border-blue-500/60 rounded-2xl p-3.5 text-center text-xs text-white focus:outline-none mb-5 transition font-semibold">

      <div class="flex gap-2.5">
        <button onclick="closeNewExerciseModal()" class="tap-press flex-1 py-3.5 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-400 font-bold text-xs">İptal</button>
        <button onclick="submitNewExercise()" class="tap-press flex-1 py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg shadow-blue-600/25">Havuza Ekle</button>
      </div>
    </div>
  </div>


  <!-- ================= ALTTAN PANEL: ÇOKLU SEÇİM ================= -->
  <div id="exercisePickerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end justify-center anim-fade" onclick="closeExerciseSelector(event)">
    <div class="bg-zinc-950 border-t border-zinc-900 w-full max-w-md rounded-t-[32px] p-5 max-h-[85vh] flex flex-col shadow-2xl anim-sheet" onclick="event.stopPropagation()">
      <div class="w-12 h-1.5 bg-zinc-800 rounded-full mx-auto mb-3.5"></div>
      
      <div class="flex justify-between items-center mb-2 px-1">
        <div>
          <h2 class="text-base font-extrabold text-white tracking-tight">Egzersiz Havuzu</h2>
          <p class="text-[11px] text-zinc-500 font-medium">Programa eklemek istediklerini seç</p>
        </div>
        <button onclick="closeExerciseSelector()" class="tap-press text-zinc-500 text-lg font-bold p-1">✕</button>
      </div>

      <button onclick="openNewExerciseModal()" class="tap-press my-3 w-full py-3 rounded-2xl bg-black border border-zinc-850 text-blue-400 text-xs font-bold shadow-sm">
        + Listede Olmayan Yeni Hareket Üret
      </button>

      <div id="pickerList" class="space-y-2 overflow-y-auto flex-1 py-1 pr-1 overscroll-contain"></div>

      <div class="pt-3.5 border-t border-zinc-900 mt-2">
        <button onclick="saveSelectedExercises()" id="btnConfirmSelect" class="tap-press w-full py-4 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs shadow-lg shadow-blue-600/25">
          Seçilenleri Kaydet
        </button>
      </div>
    </div>
  </div>


  <script>
    let globalExercisePool = JSON.parse(localStorage.getItem("fit_pool")) || [
      { id: "sp", name: "Shoulder Press", muscle: "Omuz" },
      { id: "clr", name: "Cable Lateral Raise", muscle: "Omuz" },
      { id: "bp", name: "Bench Press", muscle: "Göğüs" },
      { id: "cf", name: "Cable Fly", muscle: "Göğüs" },
      { id: "scr", name: "Seated Cable Row", muscle: "Sırt" },
      { id: "lp", name: "Lat Pulldown", muscle: "Sırt" },
      { id: "tb", name: "Triceps Bar Baş Üstü", muscle: "Triceps" },
      { id: "btk", name: "Biceps Tek Kol", muscle: "Biceps" }
    ];

    let routines = JSON.parse(localStorage.getItem("fit_routines")) || [];
    let currentRoutineId = null;
    let selectedDetailExId = null;
    let tempSelectedExerciseIds = [];
    let chartInstance = null;

    function savePool() { localStorage.setItem("fit_pool", JSON.stringify(globalExercisePool)); }
    function saveRoutines() { localStorage.setItem("fit_routines", JSON.stringify(routines)); }
    function getHistory(exId) { return JSON.parse(localStorage.getItem(`fit_history_${exId}`) || "[]"); }
    function saveHistory(exId, history) { localStorage.setItem(`fit_history_${exId}`, JSON.stringify(history)); }

    let activeSets = JSON.parse(localStorage.getItem("fit_active_sets") || "{}");
    function saveActiveSets() {
      localStorage.setItem("fit_active_sets", JSON.stringify(activeSets));
      updateCompletedCounter();
    }

    function lockScroll() { document.body.classList.add("modal-open"); }
    function unlockScroll() { document.body.classList.remove("modal-open"); }

    // --- SAYFA GEÇİŞLERİ ---
    function goHome() {
      currentRoutineId = null;
      document.getElementById("viewWorkout").classList.add("hidden");
      document.getElementById("viewExerciseDetail").classList.add("hidden");
      const vHome = document.getElementById("viewHome");
      vHome.classList.remove("hidden");
      vHome.classList.remove("anim-forward");
      vHome.classList.add("anim-back");
      renderHome();
    }

    function openWorkout(routineId) {
      currentRoutineId = routineId;
      document.getElementById("viewHome").classList.add("hidden");
      document.getElementById("viewExerciseDetail").classList.add("hidden");
      const vWorkout = document.getElementById("viewWorkout");
      vWorkout.classList.remove("hidden");
      vWorkout.classList.remove("anim-back");
      vWorkout.classList.add("anim-forward");
      renderWorkout(true);
    }

    function renderHome() {
      const container = document.getElementById("routineCardList");
      container.innerHTML = "";

      if (routines.length === 0) {
        container.innerHTML = `
          <div class="bg-zinc-950 border border-zinc-900 rounded-[28px] p-8 text-center mt-6">
            <div class="w-14 h-14 rounded-2xl bg-blue-600/10 text-blue-500 font-bold text-2xl flex items-center justify-center mx-auto mb-3">📋</div>
            <h3 class="text-base font-extrabold text-white mb-1">Henüz Program Yok</h3>
            <p class="text-xs text-zinc-500 mb-5 font-medium leading-relaxed">Yeni bir antrenman programı oluşturarak egzersizlerini eklemeye başlayabilirsin.</p>
          </div>
        `;
        return;
      }

      routines.forEach((r, idx) => {
        const count = r.exerciseIds.length;
        const card = document.createElement("div");
        card.className = "tap-press bg-zinc-950 border border-zinc-900 p-4 rounded-2xl flex items-center justify-between cursor-pointer anim-card shadow-md";
        card.style.animationDelay = `${idx * 40}ms`;
        card.onclick = () => openWorkout(r.id);
        card.innerHTML = `
          <div>
            <h3 class="text-base font-bold text-white mb-0.5 tracking-tight">${r.name}</h3>
            <p class="text-xs text-zinc-500 font-num">${count} Hareket</p>
          </div>
          <span class="text-xs font-bold text-blue-400 bg-blue-600/10 border border-blue-500/20 px-3.5 py-1.5 rounded-xl font-num">Aç ›</span>
        `;
        container.appendChild(card);
      });
    }

    // --- PROGRAM MODALI ---
    function openNewRoutineModal() {
      const modal = document.getElementById("newRoutineModal");
      const input = document.getElementById("newRoutineInput");
      input.value = "";
      modal.classList.remove("hidden");
      lockScroll();
      setTimeout(() => input.focus(), 80);
    }

    function closeNewRoutineModal() {
      document.getElementById("newRoutineModal").classList.add("hidden");
      unlockScroll();
    }

    function submitNewRoutine() {
      const input = document.getElementById("newRoutineInput");
      const name = input.value.trim();
      if (!name) return;

      const newRoutine = { id: "r_" + Date.now(), name: name, exerciseIds: [] };
      routines.push(newRoutine);
      saveRoutines();
      closeNewRoutineModal();
      setTimeout(() => openWorkout(newRoutine.id), 80);
    }

    function deleteCurrentRoutine() {
      if (confirm("Bu programı tamamen silmek istiyor musun?")) {
        routines = routines.filter(r => r.id !== currentRoutineId);
        saveRoutines();
        goHome();
      }
    }

    // --- ANTRENMAN MODU (SADECE HAREKET ADI VE İSTEĞE BAĞLI SET EKLEME) ---
    function renderWorkout(animate = false) {
      const routine = routines.find(r => r.id === currentRoutineId);
      if (!routine) return goHome();

      document.getElementById("workoutTitle").innerText = routine.name;
      document.getElementById("workoutSubtitle").innerText = `${routine.exerciseIds.length} Egzersiz`;

      const container = document.getElementById("routineContainer");
      container.innerHTML = "";

      if (routine.exerciseIds.length === 0) {
        container.innerHTML = `
          <div class="bg-zinc-950 border border-zinc-900 rounded-[28px] p-6 text-center mt-3">
            <p class="text-xs text-zinc-400 mb-1 font-semibold">Bu program henüz boş.</p>
            <p class="text-[11px] text-zinc-600 font-medium">Alttaki butona basarak hareket ekleyebilirsin.</p>
          </div>
        `;
        updateCompletedCounter();
        return;
      }

      routine.exerciseIds.forEach((exId, exIndex) => {
        const ex = globalExercisePool.find(e => e.id === exId);
        if (!ex) return;

        // Setler başlangıçta otomatik üretilmez; kullanıcı ekledikçe gelir
        if (!activeSets[exId]) {
          activeSets[exId] = [];
        }

        const sets = activeSets[exId] || [];
        const hist = getHistory(exId);
        const lastRec = hist[hist.length - 1];

        const card = document.createElement("div");
        card.className = `bg-zinc-950 border border-zinc-900 rounded-[24px] p-4 shadow-md ${animate ? 'anim-card' : ''}`;
        if (animate) card.style.animationDelay = `${exIndex * 40}ms`;

        let setsHtml = "";
        sets.forEach((set, idx) => {
          const isDone = set.done;
          setsHtml += `
            <div class="grid grid-cols-[22px_1fr_1fr_52px_36px] gap-2 items-center bg-black/60 p-2 rounded-xl border ${isDone ? 'border-blue-500/40 bg-blue-950/20' : 'border-zinc-900'} transition">
              <span class="text-[11px] font-bold ${isDone ? 'text-blue-400' : 'text-zinc-500'} text-center font-num">${idx + 1}</span>
              
              <input type="text" placeholder="${lastRec ? lastRec.kg : 'KG'}" value="${set.kg}" onchange="updateSetVal('${ex.id}', ${idx}, 'kg', this.value)" class="w-full bg-zinc-950 border border-zinc-850 rounded-lg p-2 text-center text-xs text-white focus:outline-none focus:border-blue-500/50 font-num font-bold">
              
              <input type="text" placeholder="${lastRec ? lastRec.reps : 'Rep'}" value="${set.reps}" onchange="updateSetVal('${ex.id}', ${idx}, 'reps', this.value)" class="w-full bg-zinc-950 border border-zinc-850 rounded-lg p-2 text-center text-xs text-white focus:outline-none focus:border-blue-500/50 font-num font-bold">
              
              <select onchange="updateSetVal('${ex.id}', ${idx}, 'type', this.value)" class="w-full bg-zinc-950 border border-zinc-850 rounded-lg p-2 text-center text-[10px] font-extrabold ${set.type === 'F' ? 'text-rose-400' : 'text-zinc-300'} focus:outline-none font-num">
                <option value="Norm" ${set.type === 'Norm' ? 'selected' : ''}>OK</option>
                <option value="F" ${set.type === 'F' ? 'selected' : ''}>F</option>
                <option value="R1" ${set.type === 'R1' ? 'selected' : ''}>R1</option>
                <option value="R2" ${set.type === 'R2' ? 'selected' : ''}>R2</option>
              </select>
              
              <button onclick="toggleSet('${ex.id}', ${idx})" class="tap-press w-9 h-9 rounded-xl font-extrabold flex items-center justify-center text-xs transition ${isDone ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'bg-zinc-900 text-zinc-500'}">✓</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <!-- Tıklayınca YEPYENİ SAYFAYI AÇAR -->
            <div class="cursor-pointer flex-1 py-1" onclick="openExerciseDetail('${ex.id}')">
              <h3 class="text-blue-400 font-extrabold text-sm hover:underline leading-tight tracking-tight flex items-center gap-1.5">
                ${ex.name} <span class="text-zinc-600 text-[10px]">›</span>
              </h3>
              <p class="text-[10px] text-zinc-500 font-medium mt-0.5">${ex.muscle}</p>
            </div>
            <button onclick="removeExerciseFromRoutine('${ex.id}')" class="tap-press text-zinc-600 hover:text-rose-400 text-xs px-2 py-1">✕</button>
          </div>

          ${sets.length > 0 ? `
            <div class="space-y-1 mb-2.5">
              <div class="grid grid-cols-[22px_1fr_1fr_52px_36px] gap-2 text-zinc-500 font-num text-[9px] px-1 text-center font-bold">
                <span>S</span><span>KG</span><span>REP</span><span>TÜR</span><span>TİK</span>
              </div>
              ${setsHtml}
            </div>
          ` : ''}

          <div class="flex justify-between items-center ${sets.length > 0 ? 'pt-2 border-t border-zinc-900/80' : 'pt-1'}">
            <button onclick="addSet('${ex.id}')" class="tap-press text-[11px] font-bold text-blue-400 py-1 px-2.5 rounded-lg bg-blue-600/10">+ Set Ekle</button>
            ${sets.length > 0 ? `
              <button onclick="removeSet('${ex.id}')" class="tap-press text-[10px] text-zinc-500 hover:text-rose-400 py-1 px-2 font-medium">- Set Sil</button>
            ` : '<span></span>'}
          </div>
        `;
        container.appendChild(card);
      });
      updateCompletedCounter();
    }

    function updateSetVal(exId, idx, field, val) {
      if (activeSets[exId] && activeSets[exId][idx]) {
        activeSets[exId][idx][field] = val;
        saveActiveSets();
      }
    }

    function addSet(exId) {
      const sets = activeSets[exId] || [];
      const prev = sets[sets.length - 1];
      const hist = getHistory(exId);
      const lastRec = hist[hist.length - 1];

      sets.push({
        kg: prev ? prev.kg : (lastRec ? lastRec.kg : ""),
        reps: prev ? prev.reps : (lastRec ? lastRec.reps : ""),
        type: "Norm",
        done: false
      });

      activeSets[exId] = sets;
      saveActiveSets();
      renderWorkout(false);
    }

    function removeSet(exId) {
      if (activeSets[exId] && activeSets[exId].length > 0) {
        activeSets[exId].pop();
        saveActiveSets();
        renderWorkout(false);
      }
    }

    function toggleSet(exId, idx) {
      const set = activeSets[exId][idx];
      if (!set.kg) { alert("Lütfen ağırlık yazın!"); return; }
      set.done = !set.done;
      saveActiveSets();

      if (set.done) {
        const hist = getHistory(exId);
        const date = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        hist.push({ date, kg: set.kg, reps: set.reps || "8", type: set.type });
        saveHistory(exId, hist);
      }
      renderWorkout(false);
    }

    function removeExerciseFromRoutine(exId) {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;
      current.exerciseIds = current.exerciseIds.filter(id => id !== exId);
      saveRoutines();
      renderWorkout(false);
    }

    function updateCompletedCounter() {
      const current = routines.find(r => r.id === currentRoutineId);
      let totalDone = 0;
      if (current) {
        current.exerciseIds.forEach(exId => {
          const sets = activeSets[exId] || [];
          sets.forEach(s => { if (s.done) totalDone++; });
        });
      }
      document.getElementById("completedCounter").innerText = `${totalDone} Set`;
    }

    // --- YEPYENİ TAM EKRAN HAREKET DETAY SAYFASI ---
    function openExerciseDetail(exId) {
      selectedDetailExId = exId;
      const ex = globalExercisePool.find(e => e.id === exId);
      if (!ex) return;

      document.getElementById("detailExPageTitle").innerText = ex.name;
      document.getElementById("detailExPageMuscle").innerText = ex.muscle;

      // Özel Notu Yükle
      const note = localStorage.getItem(`fit_note_${exId}`) || "";
      document.getElementById("detailExNoteInput").value = note;

      // Geçmiş Listesi
      const hist = getHistory(exId);
      const histContainer = document.getElementById("detailExHistoryList");
      histContainer.innerHTML = "";

      if (hist.length === 0) {
        histContainer.innerHTML = `<p class="text-zinc-600 text-xs py-4 text-center font-medium bg-zinc-950 border border-zinc-900 rounded-2xl">Henüz tamamlanan set kaydı yok.</p>`;
      } else {
        [...hist].reverse().forEach(h => {
          const row = document.createElement("div");
          row.className = "flex justify-between items-center bg-zinc-950 border border-zinc-900 p-3 rounded-2xl text-[11px] font-num";
          row.innerHTML = `
            <span class="text-zinc-500 font-medium">${h.date}</span>
            <span class="font-bold text-white text-xs">${h.kg} KG</span>
            <span class="text-zinc-400 font-medium">${h.reps} Rep</span>
            <span class="${h.type === 'F' ? 'text-rose-400' : 'text-zinc-400'} font-extrabold">[${h.type}]</span>
          `;
          histContainer.appendChild(row);
        });
      }

      // Kademeli Ağırlık Artış Çizgisi (Chart.js)
      const ctx = document.getElementById('detailProgressionChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = hist.map(h => h.date);
      const dataPoints = hist.map(h => {
        const nums = h.kg.match(/\d+(\.\d+)?/g);
        return nums ? nums.reduce((a, b) => parseFloat(a) + parseFloat(b), 0) : 0;
      });

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.slice(-8),
          datasets: [{
            data: dataPoints.slice(-8),
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            borderWidth: 2.5,
            tension: 0.35,
            fill: true,
            pointBackgroundColor: '#2563eb',
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717a', font: { family: 'JetBrains Mono', size: 9 } } },
            y: { grid: { color: '#18181b' }, ticks: { color: '#71717a', font: { family: 'JetBrains Mono', size: 9 } } }
          }
        }
      });

      // Sayfa Geçişi
      document.getElementById("viewWorkout").classList.add("hidden");
      const vDetail = document.getElementById("viewExerciseDetail");
      vDetail.classList.remove("hidden");
      vDetail.classList.remove("anim-back");
      vDetail.classList.add("anim-forward");
    }

    function closeExerciseDetail() {
      document.getElementById("viewExerciseDetail").classList.add("hidden");
      const vWorkout = document.getElementById("viewWorkout");
      vWorkout.classList.remove("hidden");
      vWorkout.classList.remove("anim-forward");
      vWorkout.classList.add("anim-back");
      renderWorkout(false);
    }

    function saveExerciseNote() {
      if (!selectedDetailExId) return;
      const note = document.getElementById("detailExNoteInput").value;
      localStorage.setItem(`fit_note_${selectedDetailExId}`, note);
      alert("Not kaydedildi!");
    }

    // --- HAVUZDAN ÇOKLU SEÇİM ---
    function openExerciseSelector() {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;

      tempSelectedExerciseIds = [...current.exerciseIds];
      renderPickerList();
      document.getElementById("exercisePickerModal").classList.remove("hidden");
      lockScroll();
    }

    function closeExerciseSelector() {
      document.getElementById("exercisePickerModal").classList.add("hidden");
      unlockScroll();
    }

    function renderPickerList() {
      const list = document.getElementById("pickerList");
      list.innerHTML = "";

      globalExercisePool.forEach(ex => {
        const isSelected = tempSelectedExerciseIds.includes(ex.id);
        const item = document.createElement("div");
        item.className = `tap-press flex items-center justify-between p-3.5 rounded-2xl border cursor-pointer ${isSelected ? 'bg-blue-600/10 border-blue-500/50 shadow-md' : 'bg-black border-zinc-900'}`;
        item.onclick = () => toggleTempSelection(ex.id);
        item.innerHTML = `
          <div>
            <p class="font-extrabold text-white text-xs tracking-tight">${ex.name}</p>
            <p class="text-[10px] text-zinc-500 font-medium mt-0.5">${ex.muscle}</p>
          </div>
          <div class="w-7 h-7 rounded-xl flex items-center justify-center font-extrabold text-xs transition ${isSelected ? 'bg-blue-600 text-white' : 'bg-zinc-900 text-zinc-600'}">
            ${isSelected ? '✓' : '+'}
          </div>
        `;
        list.appendChild(item);
      });

      document.getElementById("btnConfirmSelect").innerText = `${tempSelectedExerciseIds.length} Hareketi Programa Kaydet`;
    }

    function toggleTempSelection(exId) {
      if (tempSelectedExerciseIds.includes(exId)) {
        tempSelectedExerciseIds = tempSelectedExerciseIds.filter(id => id !== exId);
      } else {
        tempSelectedExerciseIds.push(exId);
      }
      renderPickerList();
    }

    function saveSelectedExercises() {
      const current = routines.find(r => r.id === currentRoutineId);
      if (!current) return;

      current.exerciseIds = [...tempSelectedExerciseIds];
      saveRoutines();
      closeExerciseSelector();
      renderWorkout(true);
    }

    function openNewExerciseModal() {
      document.getElementById("newExNameInput").value = "";
      document.getElementById("newExMuscleInput").value = "";
      document.getElementById("newExerciseModal").classList.remove("hidden");
    }

    function closeNewExerciseModal() {
      document.getElementById("newExerciseModal").classList.add("hidden");
    }

    function submitNewExercise() {
      const name = document.getElementById("newExNameInput").value.trim();
      const muscle = document.getElementById("newExMuscleInput").value.trim() || "Genel";
      if (!name) return;

      const newEx = { id: "ex_" + Date.now(), name: name, muscle: muscle };
      globalExercisePool.push(newEx);
      savePool();

      tempSelectedExerciseIds.push(newEx.id);
      closeNewExerciseModal();
      renderPickerList();
    }

    // Başlangıç: Ana Sayfa
    goHome();
  </script>
</body>
</html>
